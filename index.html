function loadProfiles() {
  try {
    const rawV4 = localStorage.getItem(STORAGE_KEYS.PROFILES);
    const rawV3 = localStorage.getItem(STORAGE_KEYS.LEGACY_PROFILES_V3);
    const rawV2 = localStorage.getItem(STORAGE_KEYS.LEGACY_PROFILES_V2);
    const rawV1 = localStorage.getItem(STORAGE_KEYS.LEGACY_PROFILES);
    const raw = rawV4 || rawV3 || rawV2 || rawV1;
    const isCurrentVersion = Boolean(rawV4);

    const merged = structuredClone(INITIAL_PROFILES);

    if (!raw) {
      localStorage.setItem(STORAGE_KEYS.PROFILES, JSON.stringify(merged));
      return merged;
    }

    const parsed = JSON.parse(raw);

    for (const langId of Object.keys(merged)) {
      const savedProf = parsed[langId];
      if (!savedProf) continue;

      // Merge vocabBank (keep user's saved words + starter words)
      const savedVocab = Array.isArray(savedProf.vocabBank) ? savedProf.vocabBank : [];
      const existingBases = new Set(savedVocab.map((v) => v.baseForm));
      const combinedVocab = [
        ...savedVocab,
        ...merged[langId].vocabBank.filter((v) => !existingBases.has(v.baseForm)),
      ];

      // If loading from v4, preserve user's chapters and active progress.
      // If migrating from v1/v2/v3, load the new expanded v4 (8-9 sentence) character-and-dialogue fiction chapters!
      const starterChapters = merged[langId].chapters;
      const savedChapters = Array.isArray(savedProf.chapters) ? savedProf.chapters : [];

      const combinedChapters =
        isCurrentVersion && savedChapters.length > 0
          ? savedChapters.map((ch, idx) => ({
              ...ch,
              chapterNumber: idx + 1,
            }))
          : starterChapters;

      merged[langId] = {
        ...merged[langId],
        ...(isCurrentVersion ? savedProf : {}),
        storyTitle: merged[langId].storyTitle,
        vocabBank: combinedVocab,
        chapters: combinedChapters,
        activeChapterIndex: isCurrentVersion
          ? Math.min(savedProf.activeChapterIndex || 0, combinedChapters.length - 1)
          : 0,
      };
    }

    localStorage.setItem(STORAGE_KEYS.PROFILES, JSON.stringify(merged));
    return merged;
  } catch (err) {
    console.error('Failed to load profiles from localStorage, falling back to defaults:', err);
    return structuredClone(INITIAL_PROFILES);
  }
}

/**
 * Returns true if a token is a character name, city/place name, pure number,
 * or non-lexical proper noun that should NOT be used as a vocabulary quiz target or distractor.
 */
function isProperNounOrNonLexicalToken(token) {
  if (!token) return true;
  const rawSurf = String(token.surface || token.word || '').trim();
  const normSurf = normalizeLexeme(rawSurf);
  const normBase = normalizeLexeme(token.baseForm || rawSurf);
  const normMeaning = normalizeLexeme(token.contextualMeaning || '');

  if (!normSurf || /^\d+$/.test(normSurf) || /^\d+$/.test(normMeaning)) {
    return true;
  }

  if (KNOWN_PROPER_NOUNS_AND_NAMES.has(normSurf) || KNOWN_PROPER_NOUNS_AND_NAMES.has(normBase)) {
    return true;
  }

  // Check if the English gloss is just a character or city name
  for (const nameCue of ENGLISH_PROPER_NAME_CUES) {
    if (
      normMeaning === nameCue ||
      normMeaning === `as for ${nameCue}` ||
      normMeaning === `to ${nameCue}` ||
      normMeaning === `${nameCue} (subject)` ||
      normMeaning === `${nameCue} (topic)` ||
      normMeaning === `${nameCue}'s`
    ) {
      return true;
    }
  }

  // If capitalized Latin word has identical English translation (e.g. "Clara" -> "Clara", "Lucas" -> "Lucas")
  const strippedPunct = rawSurf.replace(/^[«"“”'’(\s]+|[.,!?;:»"“”'’)\s]+$/g, '');
  if (
    /^[A-ZÀ-ÖØ-Þ]/.test(strippedPunct) &&
    (normSurf === normMeaning || normBase === normMeaning)
  ) {
    return true;
  }

  return false;
}

/**
 * Selects up to 5 'learning' words from a language profile's vocabBank,
 * prioritizing the lowest exposures count first.
 */
function getPriorityLearningWords(vocabBank = [], maxCount = MAX_RECYCLED_WORDS_PER_CHAPTER) {
  return [...vocabBank]
    .filter((entry) => entry.status === 'learning' && !isProperNounOrNonLexicalToken(entry))
    .sort((a, b) => {
      if (a.exposures !== b.exposures) return a.exposures - b.exposures;
      return (a.addedAt || 0) - (b.addedAt || 0);
    })
    .slice(0, maxCount);
}

/**
 * Increments exposures by +1 for all recycled vocabulary used in the completed chapter,
 * and automatically marks any word reaching 5 exposures as 'acquired'.
 */
function updateVocabExposuresAfterChapter(vocabBank = [], completedChapter) {
  if (!completedChapter) return vocabBank;

  const usedForms = new Set();

  if (Array.isArray(completedChapter.recycledWordsUsed)) {
    completedChapter.recycledWordsUsed.forEach((w) => {
      usedForms.add(normalizeLexeme(w));
    });
  }

  if (Array.isArray(completedChapter.sentences)) {
    completedChapter.sentences.forEach((sentence) => {
      (sentence.tokens || []).forEach((token) => {
        if (token.baseForm) usedForms.add(normalizeLexeme(token.baseForm));
        if (token.surface) usedForms.add(normalizeLexeme(token.surface));
      });
    });
  }

  return vocabBank.map((entry) => {
    if (entry.status === 'acquired') return entry;

    const normBase = normalizeLexeme(entry.baseForm);
    const normWord = normalizeLexeme(entry.word);
    const wasUsed = (normBase && usedForms.has(normBase)) || (normWord && usedForms.has(normWord));

    if (!wasUsed) return entry;

    const nextExposures = (entry.exposures || 0) + 1;
    const nextStatus = nextExposures >= ACQUISITION_EXPOSURE_THRESHOLD ? 'acquired' : 'learning';

    return {
      ...entry,
      exposures: nextExposures,
      status: nextStatus,
    };
  });
}

/**
 * Global array preventing Safari/WebKit JavaScriptCore from garbage-collecting
 * active SpeechSynthesisUtterance objects before `onend` fires.
 */
const ACTIVE_UTTERANCE_REFS = [];

/**
 * Switches iOS 16.4+ Safari's audio session from 'ambient' (muted by hardware Silent Switch)
 * to 'playback' (plays through speaker even when iPhone Silent Switch is on).
 */
function ensurePlaybackAudioSession() {
  try {
    if (typeof navigator !== 'undefined' && 'audioSession' in navigator && navigator.audioSession) {
      navigator.audioSession.type = 'playback';
    }
  } catch {
    // ignore if unsupported
  }
}

/**
 * Returns the local server HTTP URL (`audio/<chapterId>.wav`) for pre-rendered native chapter audio.
 */
function getPreRenderedChapterAudioUrl(chapter) {
  if (!chapter?.id) return null;
  const exactId = chapter.id;
  const baseId = (chapter.preRenderedAudioId || exactId).replace(
    /__(simplify|maintain|challenge)$/,
    ''
  );
  const suffixMatch = exactId.match(/__(simplify|challenge)$/);
  const difficultySuffix = suffixMatch ? suffixMatch[0] : '';
  return `audio/${baseId}${difficultySuffix}.wav`;
}

/**
 * Generates a short 0.25-second silent PCM WAV Blob URL (`blob:http://...`)
 * so `<audio>` can be unlocked synchronously inside the user's tap gesture
 * while the browser fetches the ElevenLabs neural MP3 directly from `api.elevenlabs.io`!
 */
let cachedSilentBlobUrl = null;
function getSilentUnlockBlobUrl() {
  if (cachedSilentBlobUrl) return cachedSilentBlobUrl;
  const sampleRate = 8000;
  const numSamples = 2000; // 0.25 seconds
  const byteLength = 44 + numSamples * 2;
  const buffer = new ArrayBuffer(byteLength);
  const view = new DataView(buffer);

  const writeStr = (offset, str) => {
    for (let i = 0; i < str.length; i += 1) {
      view.setUint8(offset + i, str.charCodeAt(i));
    }
  };

  writeStr(0, 'RIFF');
  view.setUint32(4, byteLength - 8, true);
  writeStr(8, 'WAVE');
  writeStr(12, 'fmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, 1, true);
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * 2, true);
  view.setUint16(32, 2, true);
  view.setUint16(34, 16, true);
  writeStr(36, 'data');
  view.setUint32(40, numSamples * 2, true);

  const blob = new Blob([buffer], { type: 'audio/wav' });
  cachedSilentBlobUrl = URL.createObjectURL(blob);
  return cachedSilentBlobUrl;
}

function findBestWebSpeechVoice(bcp47) {
  if (typeof window === 'undefined' || !('speechSynthesis' in window)) {
    return null;
  }
  const voices = window.speechSynthesis.getVoices() || [];
  if (!voices.length) return null;

  const normalizedTarget = (bcp47 || 'fr-FR').replace('_', '-').toLowerCase();
  const langPrefix = normalizedTarget.split('-')[0];

  const exactMatches = voices.filter(
    (v) => v.lang && v.lang.replace('_', '-').toLowerCase() === normalizedTarget
  );
  if (exactMatches.length > 0) {
    const localDefault = exactMatches.find((v) => v.localService && v.default);
    if (localDefault) return localDefault;
    const localVoice = exactMatches.find((v) => v.localService);
    if (localVoice) return localVoice;
    return exactMatches[0];
  }

  const prefixMatches = voices.filter(
    (v) => v.lang && v.lang.replace('_', '-').toLowerCase().startsWith(langPrefix)
  );
  if (prefixMatches.length > 0) {
    const localPrefix = prefixMatches.find((v) => v.localService);
    return localPrefix || prefixMatches[0];
  }

  return null;
}

function speakUtteranceSafely(text, bcp47 = 'fr-FR', rate = 0.95, callbacks = {}) {
  if (typeof window === 'undefined' || !('speechSynthesis' in window)) {
    callbacks.onError?.('Speech synthesis is not supported on this browser.');
    return null;
  }

  try {
    ensurePlaybackAudioSession();

    const utterance = new SpeechSynthesisUtterance(text);
    ACTIVE_UTTERANCE_REFS.push(utterance);

    utterance.lang = bcp47;
    utterance.rate = rate;
    utterance.volume = 1.0;

    const voice = findBestWebSpeechVoice(bcp47);
    if (voice && voice.localService) {
      utterance.voice = voice;
    }

    const cleanupRef = () => {
      const idx = ACTIVE_UTTERANCE_REFS.indexOf(utterance);
      if (idx !== -1) ACTIVE_UTTERANCE_REFS.splice(idx, 1);
    };

    utterance.onstart = () => {
      callbacks.onStart?.();
    };

    utterance.onend = () => {
      cleanupRef();
      callbacks.onEnd?.();
    };

    utterance.onerror = (event) => {
      cleanupRef();
      if (event.error === 'canceled' || event.error === 'interrupted') {
        return;
      }
      callbacks.onError?.(event);
    };

    if (window.speechSynthesis.paused) {
      window.speechSynthesis.resume();
    }

    if (window.speechSynthesis.speaking) {
      window.speechSynthesis.cancel();
      setTimeout(() => {
        window.speechSynthesis.speak(utterance);
      }, 35);
    } else {
      window.speechSynthesis.speak(utterance);
    }

    return utterance;
  } catch (err) {
    callbacks.onError?.(err);
    return null;
  }
}

const WORD_PHRASE_AUDIO_CACHE = new Map();

/**
 * Instant word or phrase pronunciation on tap/click.
 * Automatically uses ElevenLabs Neural Voice when an ElevenLabs API key is saved in settings
 * (caching the Blob URL in memory for 0ms replay), falling back to `/api/tts` or Web Speech if no key is set.
 */
async function speakSingleWord(wordText, bcp47 = 'fr-FR', rate = 0.95) {
  if (typeof window === 'undefined') return;

  const cleaned = (wordText || '')
    .replace(/[«»"“”「」『』]/g, '')
    .trim();
  if (!cleaned) return;

  ensurePlaybackAudioSession();

  const el = getSharedWordAudioElement();

  // 1. Check if the user has configured an ElevenLabs API Key in settings
  let elKey = '';
  let elVoice = DEFAULT_ELEVENLABS_VOICE_ID;
  try {
    const rawSettings = localStorage.getItem('luminaread_settings_v1');
    if (rawSettings) {
      const parsed = JSON.parse(rawSettings);
      elKey = sanitizeApiKey(parsed.elevenLabsApiKey);
      elVoice = resolveVoiceId(parsed.elevenLabsVoiceId);
    }
  } catch {
    // ignore localStorage read error
  }

  if (elKey && el) {
    const cacheKey = `${elVoice}:${cleaned}`;
    const cachedBlobUrl = WORD_PHRASE_AUDIO_CACHE.get(cacheKey);
    if (cachedBlobUrl) {
      try {
        el.pause();
        el.loop = false;
        el.playbackRate = rate;
        el.src = cachedBlobUrl;
        await el.play();
        return;
      } catch {
        // regenerate if revoked
      }
    }

    // Unlock <audio> synchronously inside the click gesture
    try {
      el.loop = false;
      el.src = getSilentUnlockBlobUrl();
      const p = el.play();
      if (p && typeof p.catch === 'function') p.catch(() => {});
    } catch {
      // ignore
    }

    try {
      const response = await requestElevenLabsTts({
        cleanKey: elKey,
        resolvedVoiceId: elVoice,
        text: cleaned,
        modelId: 'eleven_multilingual_v2',
      });
      if (response.ok) {
        const blob = await response.blob();
        if (blob && blob.size > 128) {
          const blobUrl = URL.createObjectURL(blob);
          WORD_PHRASE_AUDIO_CACHE.set(cacheKey, blobUrl);
          el.pause();
          el.loop = false;
          el.playbackRate = rate;
          el.src = blobUrl;
          await el.play();
          return;
        }
      }
    } catch {
      // fall through to local TTS if network error
    }
  }

  if (el) {
    try {
      const tl = (bcp47 || 'fr-FR').split('-')[0].toLowerCase();
      el.pause();
      el.playbackRate = rate;
      el.src = `/api/tts?tl=${encodeURIComponent(tl)}&q=${encodeURIComponent(cleaned)}`;
      const playPromise = el.play();
      if (playPromise && typeof playPromise.catch === 'function') {
        playPromise.catch(() => {
          speakUtteranceSafely(cleaned, bcp47, rate);
        });
      }
      return;
    } catch {
      // fall through to Web Speech
    }
  }

  speakUtteranceSafely(cleaned, bcp47, rate);
}

  const el = getSharedSentenceAudioElement();
  if (el) {

      el.pause();

    } catch {
      // ignore
    }
  }
  if (activeSentenceStateCallback && activeSentenceKey) {
    activeSentenceStateCallback({ sentenceKey: activeSentenceKey, status: 'idle' });
  }
  activeSentenceKey = null;
  activeSentenceStateCallback = null;
}

/**
 * Plays, pauses, or resumes a specific sentence using the user's ElevenLabs Neural Voice.
 * When `forceRestart` is true, immediately restarts the sentence from 0:00.
 */
async function controlSentenceAudio({
  sentenceKey,
  sentenceText,
  bcp47 = 'fr-FR',
  rate = 1.0,
  forceRestart = false,
  onStateChange,
}) {
  if (typeof window === 'undefined') return;
  const cleaned = (sentenceText || '')
    .replace(/[«»"“”「」『』]/g, '')
    .trim();
  if (!cleaned) return;

  ensurePlaybackAudioSession();
  const el = getSharedSentenceAudioElement();
  if (!el) return;

  const notify = (status) => {
    onStateChange?.({ sentenceKey, status });
  };

  // If clicking Play/Pause or Restart on the already-active sentence:
  if (activeSentenceKey === sentenceKey && el.src && !el.src.startsWith('blob:null')) {
    activeSentenceStateCallback = onStateChange;
    if (forceRestart) {
      try {
        el.pause();
        el.currentTime = 0;
        el.playbackRate = rate;
        await el.play();
        notify('playing');
        return;
      } catch {
        // fall through to reload if needed
      }
    } else {
      // Toggle Play / Pause
      if (!el.paused && !el.ended) {
        el.pause();
        notify('paused');
        return;
      }
      if (el.paused && !el.ended && el.currentTime > 0) {
        try {
          el.playbackRate = rate;
          await el.play();
          notify('playing');
          return;
        } catch {
          // fall through to reload
        }
      }
    }
  }

  // Switching to a different sentence: notify previous sentence is now idle
  if (activeSentenceKey && activeSentenceKey !== sentenceKey && activeSentenceStateCallback) {
    activeSentenceStateCallback({ sentenceKey: activeSentenceKey, status: 'idle' });
  }

  activeSentenceKey = sentenceKey;
  activeSentenceStateCallback = onStateChange;

  el.onended = () => {
    if (activeSentenceKey === sentenceKey) {
      notify('idle');
    }
  };
  el.onerror = () => {
    if (activeSentenceKey === sentenceKey) {
      notify('idle');
    }
  };

  const { elKey, elVoice } = getSavedElevenLabsCredentials();
  const cacheKey = `${elVoice}:${cleaned}`;

  if (elKey) {
    const cachedBlobUrl = WORD_PHRASE_AUDIO_CACHE.get(cacheKey);
    if (cachedBlobUrl) {
      try {
        el.pause();
        el.loop = false;
        el.src = cachedBlobUrl;
        el.currentTime = 0;
        el.playbackRate = rate;
        await el.play();
        notify('playing');
        return;
      } catch {
        // regenerate if revoked
      }
    }

    notify('loading');

    // Unlock <audio> synchronously inside user gesture
    try {
      el.loop = false;
      el.src = getSilentUnlockBlobUrl();
      const p = el.play();
      if (p && typeof p.catch === 'function') p.catch(() => {});
    } catch {
      // ignore
    }

    try {
      const response = await requestElevenLabsTts({
        cleanKey: elKey,
        resolvedVoiceId: elVoice,
        text: cleaned,
        modelId: 'eleven_multilingual_v2',
      });
      if (response.ok) {
        const blob = await response.blob();
        if (blob && blob.size > 128) {
          const blobUrl = URL.createObjectURL(blob);
          WORD_PHRASE_AUDIO_CACHE.set(cacheKey, blobUrl);
          if (activeSentenceKey !== sentenceKey) return;
          el.pause();
          el.loop = false;
          el.src = blobUrl;
          el.currentTime = 0;
          el.playbackRate = rate;
          await el.play();
          notify('playing');
          return;
        }
      }
    } catch {
      // fall through to fallback TTS if network error
    }
  }

  // Fallback if no ElevenLabs key is set yet
  try {
    const tl = (bcp47 || 'fr-FR').split('-')[0].toLowerCase();
    el.pause();
    el.loop = false;
    el.src = `/api/tts?tl=${encodeURIComponent(tl)}&q=${encodeURIComponent(cleaned)}`;
    el.currentTime = 0;
    el.playbackRate = rate;
    await el.play();
    notify('playing');
  } catch {
    notify('idle');
  }
}

async function parseElevenLabsError(response) {
  let statusCode = response.status;
  let rawMessage = '';
  let errorStatus = '';

  try {
    const errData = await response.json();
    if (typeof errData?.detail === 'string') {
      rawMessage = errData.detail;
    } else if (errData?.detail && typeof errData.detail === 'object') {
      rawMessage = errData.detail.message || JSON.stringify(errData.detail);
      errorStatus = errData.detail.status || '';
    } else if (errData?.error) {
      rawMessage = errData.error;
    }
  } catch {
    try {
      rawMessage = await response.text();
    } catch {
      rawMessage = '';
    }
  }

  if (statusCode === 401) {
    return `Invalid ElevenLabs API Key (HTTP 401${rawMessage ? `: ${rawMessage}` : ''}).`;
  }
  if (statusCode === 402 || /quota_exceeded/i.test(errorStatus) || /quota/i.test(rawMessage)) {
    return `ElevenLabs character quota reached (${rawMessage || 'HTTP 402'}).`;
  }
  if (statusCode === 404 || /voice_not_found/i.test(errorStatus)) {
    return `ElevenLabs Voice ID not found (HTTP 404).`;
  }
  return `ElevenLabs TTS Error (HTTP ${statusCode})${rawMessage ? `: ${rawMessage}` : ''}`;
}

async function requestElevenLabsTts({ cleanKey, resolvedVoiceId, text, modelId }) {
  const payload = JSON.stringify({
    text,
    model_id: modelId,
    voice_settings: {
      stability: 0.5,
      similarity_boost: 0.75,
    },
  });

  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 25000);
  try {
    return await fetch(
      `https://api.elevenlabs.io/v1/text-to-speech/${encodeURIComponent(
        resolvedVoiceId
      )}?output_format=mp3_44100_128`,
      {
        method: 'POST',
        signal: controller.signal,
        headers: {
          Accept: 'audio/mpeg',
          'Content-Type': 'application/json',
          'xi-api-key': cleanKey,
        },
        body: payload,
      }
    );
  } finally {
    clearTimeout(timeoutId);
  }
}

async function synthesizeChapterWithElevenLabs({
  chapter,
  elevenLabsApiKey,
  voiceId = DEFAULT_ELEVENLABS_VOICE_ID,
}) {
  const cleanKey = sanitizeApiKey(elevenLabsApiKey);
  if (!cleanKey) {
    throw new Error('No ElevenLabs API key configured.');
  }

  const resolvedVoiceId = resolveVoiceId(voiceId);
  const fullChapterText = (chapter?.sentences || [])
    .map((s) => s.fullSentence)
    .join(' ')
    .trim();

  if (!fullChapterText) {
    throw new Error('Chapter has no sentences to narrate.');
  }

  let response = await requestElevenLabsTts({
    cleanKey,
    resolvedVoiceId,
    text: fullChapterText,
    modelId: 'eleven_multilingual_v2',
  });

  if (!response.ok && response.status !== 401 && response.status !== 402) {
    const fallbackResponse = await requestElevenLabsTts({
      cleanKey,
      resolvedVoiceId,
      text: fullChapterText,
      modelId: DEFAULT_ELEVENLABS_MODEL,
    });
    if (fallbackResponse.ok) {
      response = fallbackResponse;
    }
  }

  if (!response.ok) {
    const detailedError = await parseElevenLabsError(response);
    throw new Error(detailedError);
  }

  const blob = await response.blob();
  if (!blob || blob.size < 256) {
    throw new Error('ElevenLabs returned an empty audio stream.');
  }

  return URL.createObjectURL(blob);
}

async function testElevenLabsConnection({
  elevenLabsApiKey,
  voiceId = DEFAULT_ELEVENLABS_VOICE_ID,
}) {
  const cleanKey = sanitizeApiKey(elevenLabsApiKey);
  if (!cleanKey) {
    throw new Error('Please enter your ElevenLabs API Key first.');
  }

  const resolvedVoiceId = resolveVoiceId(voiceId);
  const sampleText = 'Bonjour! ElevenLabs multilingual narration is connected.';

  let response = await requestElevenLabsTts({
    cleanKey,
    resolvedVoiceId,
    text: sampleText,
    modelId: 'eleven_multilingual_v2',
  });

  if (!response.ok && response.status !== 401 && response.status !== 402) {
    const fallbackResponse = await requestElevenLabsTts({
      cleanKey,
      resolvedVoiceId,
      text: sampleText,
      modelId: DEFAULT_ELEVENLABS_MODEL,
    });
    if (fallbackResponse.ok) {
      response = fallbackResponse;
    }
  }

  if (!response.ok) {
    const detailedError = await parseElevenLabsError(response);
    throw new Error(detailedError);
  }

  const blob = await response.blob();
  return URL.createObjectURL(blob);
}

function speakFullChapterWithWebSpeech({
  chapter,
  bcp47 = 'fr-FR',
  rate = 1.0,
  onSentenceStart,
  onComplete,
  onError,
}) {
  const sentences = (chapter?.sentences || []).map((s) => s.fullSentence).filter(Boolean);
  if (sentences.length === 0) {
    onComplete?.();
    return () => {};
  }

  ensurePlaybackAudioSession();

  let cancelled = false;
  let currentIdx = 0;

  const speakNext = () => {
    if (cancelled || currentIdx >= sentences.length) {
      if (!cancelled) onComplete?.();
      return;
    }

    const cleanText =
      sentences[currentIdx].replace(/[«»“”„"「」『』]/g, ' ').replace(/\s+/g, ' ').trim() ||
      sentences[currentIdx];

    speakUtteranceSafely(cleanText, bcp47, rate, {
      onStart: () => {
        if (!cancelled) onSentenceStart?.(currentIdx);
      },
      onEnd: () => {
        if (cancelled) return;
        currentIdx += 1;
        speakNext();
      },
      onError: () => {
        if (cancelled) return;
        onError?.('Tap "Play Full Chapter" once more to start voice narration.');
      },
    });
  };

  speakNext();

  return () => {
    cancelled = true;
    ACTIVE_UTTERANCE_REFS.length = 0;
    if (typeof window !== 'undefined' && 'speechSynthesis' in window) {
      try {
        window.speechSynthesis.cancel();
      } catch {
        // ignore
      }
    }
  };
}

/**
 * Built-in Google Translate & Dictionary service for translating and looking up words/sentences
 * across French (fr), Italian (it), Korean (ko), Japanese (ja), Spanish (es), Thai (th), and English (en).
 */
async function translateToEnglish(text, sourceLang = 'auto') {
  const trimmed = (text || '').trim();
  if (!trimmed) {
    return { translatedText: '', detectedSourceLang: sourceLang };
  }

  const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${encodeURIComponent(
    sourceLang
  )}&tl=en&dt=t&q=${encodeURIComponent(trimmed)}`;

  const response = await fetch(url);
  if (!response.ok) {
    throw new Error(`Google Translate request failed (HTTP ${response.status})`);
  }

  const data = await response.json();
  const segments = Array.isArray(data?.[0]) ? data[0] : [];
  const translatedText = segments
    .map((segment) => (Array.isArray(segment) ? segment[0] : ''))
    .join('');

  const detectedSourceLang = data?.[2] || sourceLang;

  return {
    translatedText: translatedText || trimmed,
    detectedSourceLang,
  };
}

/**
 * Rich Dictionary & Phrase Lookup using Google Translate's dictionary (`dt=bd`) and
 * phonetic transliteration (`dt=rm`) endpoints. Supports both TargetLang -> English
 * and English -> TargetLang lookups!
 */
async function lookupDictionaryWordOrPhrase({
  query,
  sourceLang = 'fr',
  targetLang = 'en',
}) {
  const trimmed = (query || '').trim();
  if (!trimmed) {
    return null;
  }

  const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${encodeURIComponent(
    sourceLang
  )}&tl=${encodeURIComponent(targetLang)}&dt=t&dt=bd&dt=rm&q=${encodeURIComponent(
    trimmed
  )}`;

  const response = await fetch(url);
  if (!response.ok) {
    throw new Error(`Dictionary lookup failed (HTTP ${response.status})`);
  }

  const data = await response.json();

  // 1. Primary translation (data[0])
  const segments = Array.isArray(data?.[0]) ? data[0] : [];
  const primaryTranslation = segments
    .filter((seg) => Array.isArray(seg) && typeof seg[0] === 'string')
    .map((seg) => seg[0])
    .join('');

  // 2. Phonetic reading / transliteration (often in the last element of data[0])
  let phonetic = null;
  for (const seg of segments) {
    if (Array.isArray(seg) && (seg[3] || seg[2])) {
      phonetic = seg[3] || seg[2];
    }
  }

  // 3. Dictionary parts of speech & alternative meanings (data[1])
  const dictionaryEntries = [];
  if (Array.isArray(data?.[1])) {
    data[1].forEach((posBlock) => {
      const partOfSpeech = posBlock?.[0] || 'term';
      const terms = Array.isArray(posBlock?.[1]) ? posBlock[1].slice(0, 5) : [];
      const detailedRows = Array.isArray(posBlock?.[2])
        ? posBlock[2].slice(0, 4).map((row) => ({
            word: row?.[0] || '',
            reverseTranslations: Array.isArray(row?.[1]) ? row[1].slice(0, 3) : [],
          }))
        : [];
      dictionaryEntries.push({
        partOfSpeech,
        terms,
        detailedRows,
      });
    });
  }

  return {
    query: trimmed,
    sourceLang,
    targetLang,
    primaryTranslation: primaryTranslation || trimmed,
    phonetic,
    dictionaryEntries,
  };
}

function buildGoogleTranslateWebUrl(text, sourceLang = 'auto', targetLang = 'en') {
  return `https://translate.google.com/?sl=${encodeURIComponent(
    sourceLang
  )}&tl=${encodeURIComponent(targetLang)}&text=${encodeURIComponent(
    text || ''
  )}&op=translate`;
}

let offlineRegenerateCounter = 0;

/**
 * Generates an instant pre-tokenised chapter from the local bonus scene bank or variation engine
 * when no Gemini API key is configured yet.
 */
function generateOfflineBonusChapter(
  profile,
  adjustment = 'regenerate',
  targetChapterNumber = null,
  currentChapter = null
) {
  const chapterNum =
    targetChapterNumber || (profile.chapters?.length || 0) + 1;
  const langBank = BONUS_SCENE_BANK[profile.id] || [];
  const baseChapters = profile.chapters || [];

  offlineRegenerateCounter += 1;

  if (langBank.length > 0) {
    let pickedIdx = offlineRegenerateCounter % langBank.length;
    let pickedScene = langBank[pickedIdx];
    if (
      langBank.length > 1 &&
      currentChapter?.chapterTitle &&
      currentChapter.chapterTitle.includes(pickedScene.title)
    ) {
      pickedIdx = (offlineRegenerateCounter + 1) % langBank.length;
      pickedScene = langBank[pickedIdx];
    }

    return {
      id: `${profile.id}-ch-${chapterNum}-${Date.now()}`,
      preRenderedAudioId: `${profile.id}-bonus-${pickedIdx}`,
      chapterNumber: chapterNum,
      difficultyLabel: `${profile.cefrLevel} • Fresh Story & Vocabulary`,
      chapterTitle: `Chapter ${chapterNum} : ${pickedScene.title}`,
      updatedArcSummary: pickedScene.summary,
      recycledWordsUsed: pickedScene.recycled,
      sentences: structuredClone(pickedScene.sentences),
    };
  }

  // Fallback alternate story from other chapters if offline without Gemini key
  const otherChapters = baseChapters.filter((c) => c.id !== currentChapter?.id);
  const pool = otherChapters.length > 0 ? otherChapters : baseChapters;
  const sourceChapter = pool[offlineRegenerateCounter % pool.length];
  const rawTitle = (sourceChapter.chapterTitle || '').replace(
    /^(Chapter|Chapitre|Capitolo|Capítulo|제\d+장|第\d+章|บทที่\s*\d+)\s*\d*\s*[:：]?\s*/i,
    ''
  );

  return {
    ...structuredClone(sourceChapter),
    id: `${profile.id}-ch-${chapterNum}-${Date.now()}`,
    preRenderedAudioId: sourceChapter.preRenderedAudioId || sourceChapter.id,
    chapterNumber: chapterNum,
    difficultyLabel: `${profile.cefrLevel} • Fresh Story & Vocabulary`,
    chapterTitle: `Chapter ${chapterNum} : ${rawTitle}`,
  };
}

/**
 * Generates the next sequential chapter (or regenerates the current chapter with fresh text & vocabulary)
 * using Gemini 2.5 Flash with pre-tokenised JSON output.
 */
async function generateNextChapter({
  profile,
  adjustment = 'maintain',
  apiKey,
  targetChapterNumber = null,
  currentChapter = null,
}) {
  const nextChapterNumber =
    targetChapterNumber || (profile.chapters?.length || 0) + 1;

  // If user has no Gemini key yet, provide an instant pre-tokenised chapter for this chapter number
  if (!apiKey || !apiKey.trim()) {
    return generateOfflineBonusChapter(
      profile,
      adjustment,
      nextChapterNumber,
      currentChapter
    );
  }

  const targetLearningWords = getPriorityLearningWords(profile.vocabBank, 5);
  const diffConfig =
    DIFFICULTY_INSTRUCTIONS[adjustment] || DIFFICULTY_INSTRUCTIONS.maintain;

  const targetWordsPromptBlock =
    targetLearningWords.length > 0
      ? `TARGET LEARNING WORDS TO NATURALLY RECYCLE IN THIS CHAPTER (up to 5 words with lowest exposures):
${targetLearningWords
  .map(
    (w, i) =>
      `${i + 1}. baseForm: "${w.baseForm}" (surface seen: "${w.word}", meaning: "${w.contextualMeaning}", exposures: ${w.exposures}/5)`
  )
  .join('\n')}
You MUST naturally weave as many of these target words as fit the plot into the new chapter in fresh, meaningful contexts, and list the baseForms you used in "recycledWordsUsed". Also introduce 3 to 4 useful new words in context.`
      : `Introduce 4 to 5 high-utility new words appropriate for ${profile.cefrLevel} and list their baseForms in "recycledWordsUsed".`;

  const scriptSpecificRules =
    profile.id === 'ja'
      ? `JAPANESE CJK & FURIGANA RULES (CRITICAL):
- Never rely on space-separated tokens. Split every sentence into natural morphological word/particle tokens so concatenating "surface" across all tokens reconstructs the exact Japanese sentence.
- Attach Japanese punctuation (、 or 。 or 「」) to the end of the preceding token's "surface".
- For "reading": provide the exact Hiragana reading ONLY if the token's "surface" contains at least one Kanji character (e.g. surface: "時計", reading: "とけい"). If a token is pure Hiragana or Katakana, "reading" MUST be null.
- For "romanisation": provide accurate Hepburn Romaji for the full sentence.`

      : `LATIN SCRIPT (${profile.name.toUpperCase()}) RULES (CRITICAL):
- Split each sentence into individual clickable word tokens (keeping trailing punctuation like commas or periods attached to the word's "surface", while keeping "baseForm" clean without punctuation).
- "reading" MUST be null for all tokens.
- "romanisation" MUST be null for all sentences.`;

  const systemPrompt = `You are a bestselling fiction author and master graded-reader creator trained in Stephen Krashen's Comprehensible Input (i+1) hypothesis and Olly Richards' StoryLearning method.

Write Chapter ${nextChapterNumber} of the ongoing serial story "${profile.storyTitle}" in ${profile.name} (${profile.nativeName}), strictly calibrated for ${profile.cefrLevel}.

CONTINUOUS PLOT CONTEXT (storyArcSummary so far):
"${profile.storyArcSummary}"

FICTION & DIALOGUE QUALITY REQUIREMENTS (MANDATORY):
- This MUST be a genuinely engaging, page-turning fiction story that people actually love reading—NEVER a dry textbook exercise or disconnected phrase list!
- Include vivid named characters who interact with personality, emotion, curiosity, or suspense.
- Include natural spoken dialogue in at least 2 to 3 sentences of the chapter (using appropriate quotation marks for the language, e.g. « ... », “...”, or 「...」).
- End the chapter with a compelling narrative discovery, twist, or hook that makes the reader eager for the next chapter, while keeping vocabulary and grammar 100% appropriate for ${profile.cefrLevel}.

ADAPTIVE DIFFICULTY DIRECTIVE (${diffConfig.label}):
${diffConfig.promptDirective}

${targetWordsPromptBlock}

${scriptSpecificRules}

ENGLISH TRANSLATION & GRAMMAR NOTE RULES:
- Every sentence MUST include "englishTranslation" with a clear, natural English translation of the full sentence.
- Every sentence MUST include a "grammarNote" consisting of a single, plain-English sentence explaining the core recurring sentence pattern used in that sentence, avoiding dense academic jargon.

CHAPTER LENGTH:
- Write 8 to 9 cohesive, character-and-dialogue-driven sentences with fresh, practical vocabulary that advance the plot naturally.`;

  const response = await fetch(`${GEMINI_ENDPOINT}?key=${encodeURIComponent(apiKey.trim())}`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
    },
    body: JSON.stringify({
      contents: [
        {
          role: 'user',
          parts: [{ text: systemPrompt }],
        },
      ],
      generationConfig: {
        responseMimeType: 'application/json',
        responseSchema: GEMINI_CHAPTER_RESPONSE_SCHEMA,
        temperature: 0.75,
      },
    }),
  });

  if (!response.ok) {
    let errorDetail = `HTTP ${response.status}`;
    try {
      const errJson = await response.json();
      errorDetail = errJson?.error?.message || errorDetail;
    } catch {
      // ignore json parse failure
    }
    throw new Error(`Gemini API Error: ${errorDetail}`);
  }

  const data = await response.json();
  const rawText = data?.candidates?.[0]?.content?.parts?.[0]?.text;

  if (!rawText) {
    throw new Error('Gemini returned an empty response. Please try again.');
  }

  let parsedChapter;
  try {
    parsedChapter = JSON.parse(rawText);
  } catch (err) {
    throw new Error(`Failed to parse Gemini JSON output: ${err.message}`);
  }

  if (!Array.isArray(parsedChapter.sentences) || parsedChapter.sentences.length === 0) {
    throw new Error('Generated chapter did not contain valid pre-tokenised sentences.');
  }

  return {
    id: `${profile.id}-ch-${nextChapterNumber}-${Date.now()}`,
    chapterNumber: nextChapterNumber,
    difficultyLabel: `${profile.cefrLevel} • ${diffConfig.label}`,
    chapterTitle: parsedChapter.chapterTitle || `Chapter ${nextChapterNumber}`,
    updatedArcSummary: parsedChapter.updatedArcSummary || profile.storyArcSummary,
    recycledWordsUsed: Array.isArray(parsedChapter.recycledWordsUsed)
      ? parsedChapter.recycledWordsUsed
      : [],
    sentences: parsedChapter.sentences.map((s) => ({
      fullSentence: s.fullSentence || '',
      englishTranslation: s.englishTranslation || '',
      romanisation: profile.isCJK ? s.romanisation || null : null,
      grammarNote: s.grammarNote || 'Notice how the words group together to express a complete thought.',

        surface: t.surface || '',
        reading: profile.hasFurigana ? t.reading || null : null,
        baseForm: t.baseForm || t.surface || '',
        contextualMeaning: t.contextualMeaning || '',
      })),
    })),
  };
}

/**
 * Creates a simplified (shorter, easier) or challenged (longer, more complex) version
 * of `baseChapter` offline when no Gemini API key is configured.
 */
function createOfflineDifficultyVariant(baseChapter, level, profile) {
  const cleanBase = structuredClone(baseChapter);
  const baseId = (cleanBase.id || `${profile.id}-ch-${cleanBase.chapterNumber}`).replace(
    /__(simplify|maintain|challenge)$/,
    ''
  );

  if (level === 'maintain') {
    return {
      ...cleanBase,
      id: `${baseId}__maintain`,
      activeDifficulty: 'maintain',
      difficultyLabel: `${profile.cefrLevel} • Just Right (Standard)`,
    };
  }

  if (level === 'simplify') {
    // Simplify: keep 6 essential sentences (first 5 + closing sentence) so even simplified chapters are a substantial, engaging read
    const all = cleanBase.sentences || [];
    const coreSentences =
      all.length > 6
        ? [...all.slice(0, 5), all[all.length - 1]]
        : all.slice(0, Math.max(4, all.length));
    return {
      ...cleanBase,
      id: `${baseId}__simplify`,
      activeDifficulty: 'simplify',
      difficultyLabel: `${profile.cefrLevel} • Simplified (Shorter & Easier)`,
      sentences: coreSentences,
    };
  }

  // level === 'challenge': Keep all original sentences AND weave in longer, more complex extension sentences
  const extras = CHALLENGE_EXTENSION_BANK[profile.id] || CHALLENGE_EXTENSION_BANK.fr;
  return {
    ...cleanBase,
    id: `${baseId}__challenge`,
    activeDifficulty: 'challenge',
    difficultyLabel: `${profile.cefrLevel} • More Complex (Longer & Richer)`,
    sentences: [...cleanBase.sentences, ...structuredClone(extras)],
  };
}

/**
 * Generates or adapts a specific difficulty version ('simplify' | 'maintain' | 'challenge')
 * of the CURRENT chapter (`baseChapter`) so the user can switch back and forth between
 * difficulty levels within the exact same chapter!
 */
async function generateChapterDifficultyVariant({
  profile,
  baseChapter,
  level = 'maintain',
  apiKey,
}) {
  if (level === 'maintain') {
    return createOfflineDifficultyVariant(baseChapter, 'maintain', profile);
  }

  if (!apiKey || !apiKey.trim()) {
    return createOfflineDifficultyVariant(baseChapter, level, profile);
  }

  const baseId = (baseChapter.id || `${profile.id}-ch-${baseChapter.chapterNumber}`).replace(
    /__(simplify|maintain|challenge)$/,
    ''
  );

  const originalSentencesText = (baseChapter.sentences || [])
    .map((s, i) => `${i + 1}. ${s.fullSentence} (${s.englishTranslation || ''})`)
    .join('\n');

  const rewriteDirective =
    level === 'simplify'
      ? `TASK — SIMPLIFY THIS CHAPTER ("Too Hard" -> Simpler Version):
Rewrite the exact fiction story of this chapter into a SIMPLER, EASIER-TO-READ version (6 clear, engaging sentences).
- Keep the exact same named characters, setting, plot events, and spoken dialogue as the original chapter below.
- Include at least 2 short lines of direct spoken dialogue between the characters.
- Use shorter sentences, simpler high-frequency vocabulary, and straightforward grammar strictly within ${profile.cefrLevel}.`
      : `TASK — EXPAND & DEEPEN THIS CHAPTER ("Too Easy" -> Longer & More Complex Version):
Rewrite and expand the exact fiction story of this chapter into a LONGER, RICHER, SLIGHTLY MORE COMPLEX version (10 to 12 longer sentences).
- Keep the exact same named characters, setting, and plot events as the original chapter below, but add richer atmospheric detail, deeper character dialogue, natural connectors (e.g. although, while, therefore), and expressive phrasing.`;

  const scriptSpecificRules =
    profile.id === 'ja'
      ? `JAPANESE RULES: Split into natural morphological word/particle tokens. Provide Hiragana "reading" ONLY for tokens containing Kanji (null for pure Hiragana/Katakana). Provide Hepburn Romaji in "romanisation".`

      : `LATIN SCRIPT RULES: Split into individual clickable word tokens. "reading" and "romanisation" MUST be null.`;

  const prompt = `You are an expert language teacher adapting Chapter ${baseChapter.chapterNumber} ("${baseChapter.chapterTitle}") in ${profile.name} (${profile.cefrLevel}).

ORIGINAL "JUST RIGHT" CHAPTER SENTENCES:
${originalSentencesText}

${rewriteDirective}

${scriptSpecificRules}

Every sentence MUST include "englishTranslation" and a 1-sentence plain-English "grammarNote". Keep the chapterTitle the same as "${baseChapter.chapterTitle}".`;

  try {
    const response = await fetch(
      `${GEMINI_ENDPOINT}?key=${encodeURIComponent(apiKey.trim())}`,
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ role: 'user', parts: [{ text: prompt }] }],
          generationConfig: {
            responseMimeType: 'application/json',
            responseSchema: GEMINI_CHAPTER_RESPONSE_SCHEMA,
            temperature: 0.65,
          },
        }),
      }
    );

    if (!response.ok) {
      return createOfflineDifficultyVariant(baseChapter, level, profile);
    }

    const data = await response.json();
    const rawText = data?.candidates?.[0]?.content?.parts?.[0]?.text;
    const parsed = JSON.parse(rawText);

    if (!Array.isArray(parsed?.sentences) || parsed.sentences.length === 0) {
      return createOfflineDifficultyVariant(baseChapter, level, profile);
    }

    return {
      ...baseChapter,
      id: `${baseId}__${level}`,
      activeDifficulty: level,
      difficultyLabel:
        level === 'simplify'
          ? `${profile.cefrLevel} • Simplified (Shorter & Easier)`
          : `${profile.cefrLevel} • More Complex (Longer & Richer)`,
      chapterTitle: baseChapter.chapterTitle,
      recycledWordsUsed: Array.isArray(parsed.recycledWordsUsed)
        ? parsed.recycledWordsUsed
        : baseChapter.recycledWordsUsed || [],
      sentences: parsed.sentences.map((s) => ({
        fullSentence: s.fullSentence || '',
        englishTranslation: s.englishTranslation || '',
        romanisation: profile.isCJK ? s.romanisation || null : null,
        grammarNote:
          s.grammarNote ||
          'Notice how the words group together to express a complete thought.',
        tokens: (s.tokens || []).map((t) => ({
          surface: t.surface || '',
          reading:
            profile.hasFurigana ? t.reading || null : null,
          baseForm: t.baseForm || t.surface || '',
          contextualMeaning: t.contextualMeaning || '',
        })),
      })),
    };
  } catch {
    return createOfflineDifficultyVariant(baseChapter, level, profile);
  }
}

function formatTime(seconds) {
  if (!Number.isFinite(seconds) || seconds < 0) return '00:00';
  const mins = Math.floor(seconds / 60);
  const secs = Math.floor(seconds % 60);
  return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
}

/**
 * Computes proportional start/end ratios and time ranges for each sentence in a chapter
 * weighted by each sentence's character length.
 */
function getSentenceSegments(sentences = [], duration = 0) {
  if (!Array.isArray(sentences) || sentences.length === 0) return [];
  const safeDuration = Number.isFinite(duration) && duration > 0.2 ? duration : 0;
  const lengths = sentences.map((s) => Math.max(8, (s?.fullSentence || '').length));
  const totalChars = lengths.reduce((acc, n) => acc + n, 0) || 1;

  let cumulative = 0;
  return sentences.map((s, idx) => {
    const weightRatio = lengths[idx] / totalChars;
    const startRatio = cumulative;
    cumulative += weightRatio;
    const endRatio = idx === sentences.length - 1 ? 1 : cumulative;
    return {
      index: idx,
      text: s?.fullSentence || `Sentence ${idx + 1}`,
      translation: s?.sentenceTranslation || '',
      weightRatio,
      startRatio,
      endRatio,
      startTime: startRatio * safeDuration,
      endTime: endRatio * safeDuration,
    };
  });
}

/**
 * Estimates which sentence index (0..N-1) is currently being narrated at `currentTime`
 * out of `duration`, weighted by each sentence's character length.
 */
function getSentenceIndexAtTime(sentences = [], currentTime = 0, duration = 0) {
  if (!Array.isArray(sentences) || sentences.length === 0) return null;
  if (!Number.isFinite(duration) || duration <= 0.2) return 0;

  const progress = Math.max(0, Math.min(0.999, currentTime / duration));
  const segments = getSentenceSegments(sentences, duration);
  for (let i = 0; i < segments.length; i += 1) {
    if (progress < segments[i].endRatio || i === segments.length - 1) {
      return i;
    }
  }
  return segments.length - 1;
}

function AudioPlayerBar({
  chapter,
  bcp47,
  settings,
  audioBlobUrls,
  onCacheChapterBlobUrl,
  activeSpokenSentenceIdx,
  setActiveSpokenSentenceIdx,
}) {
  const [isGeneratingAudio, setIsGeneratingAudio] = useState(false);
  const [isPlaying, setIsPlaying] = useState(false);
  const [playbackRate, setPlaybackRate] = useState(1.0);
  const [audioError, setAudioError] = useState(null);

  const [currentTime, setCurrentTime] = useState(0);
  const [duration, setDuration] = useState(0);

  const htmlAudioRef = useRef(null);
  const playbackRateRef = useRef(1.0);
  const activeStreamSourceRef = useRef(''); // tracks current <audio> src
  const isSilentUnlockActiveRef = useRef(false);
  const pendingSeekRatioRef = useRef(null);

  const hasElevenLabsKey = Boolean(settings?.elevenLabsApiKey?.trim());
  const cachedAudioKey = chapter?.id ? audioBlobUrls[chapter.id] : null;

  const sentenceSegments = useMemo(
    () => getSentenceSegments(chapter?.sentences || [], duration),
    [chapter?.sentences, duration]
  );

  const currentSentenceIdx = useMemo(() => {
    if (activeSpokenSentenceIdx !== null && activeSpokenSentenceIdx !== undefined) {
      return activeSpokenSentenceIdx;
    }
    if (duration > 0.2 && currentTime > 0.05) {
      return getSentenceIndexAtTime(chapter?.sentences, currentTime, duration) ?? 0;
    }
    return 0;
  }, [activeSpokenSentenceIdx, chapter?.sentences, currentTime, duration]);

  useEffect(() => {
    stopAllPlayback(true);
    setAudioError(null);
    setCurrentTime(0);
    setDuration(0);
    activeStreamSourceRef.current = '';
    isSilentUnlockActiveRef.current = false;
    pendingSeekRatioRef.current = null;
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [chapter?.id, bcp47]);

  useEffect(() => {
    return () => {
      stopAllPlayback(true);
    };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  const stopAllPlayback = (resetOffset = true) => {
    setIsGeneratingAudio(false);
    isSilentUnlockActiveRef.current = false;
    pendingSeekRatioRef.current = null;

    if (htmlAudioRef.current) {
      try {
        htmlAudioRef.current.pause();
        if (resetOffset) {
          htmlAudioRef.current.currentTime = 0;
        }
      } catch {
        // ignore
      }
    }

    if (resetOffset) {
      setCurrentTime(0);
    }

    setIsPlaying(false);
    setActiveSpokenSentenceIdx(null);
  };

  const playUrlOnHtmlAudio = async (targetUrl, targetSeekRatio = null) => {
    const el = htmlAudioRef.current;
    if (!el || !targetUrl) {
      return false;
    }

    isSilentUnlockActiveRef.current = false;
    el.loop = false;
    el.muted = false;
    el.volume = 1.0;
    el.playbackRate = playbackRateRef.current;

    if (targetSeekRatio !== null && Number.isFinite(targetSeekRatio)) {
      pendingSeekRatioRef.current = targetSeekRatio;
    }

    if (activeStreamSourceRef.current !== targetUrl) {
      activeStreamSourceRef.current = targetUrl;
      el.src = targetUrl;
    } else if (
      pendingSeekRatioRef.current !== null &&
      Number.isFinite(el.duration) &&
      el.duration > 0.5
    ) {
      const seekTime = pendingSeekRatioRef.current * el.duration;
      el.currentTime = seekTime;
      setCurrentTime(seekTime);
      pendingSeekRatioRef.current = null;
    }

    try {
      await el.play();
      setIsGeneratingAudio(false);
      setIsPlaying(true);
      return true;
    } catch (err) {
      console.warn('HTML5 audio play() rejected:', err);
      return false;
    }
  };

  const handlePlayPause = async (overrideSeekRatio = null) => {
    setAudioError(null);
    ensurePlaybackAudioSession();

    const hasExplicitSeek =
      typeof overrideSeekRatio === 'number' && Number.isFinite(overrideSeekRatio);

    // 1. If currently playing and no explicit sentence jump requested, pause immediately
    if (isPlaying && !hasExplicitSeek) {
      if (htmlAudioRef.current) {
        htmlAudioRef.current.pause();
      }
      setIsPlaying(false);
      return;
    }

    const el = htmlAudioRef.current;

    // Check if we have pre-rendered static audio bundled in audio/{chapter.id}.wav
    const preRenderedAudioUrl = chapter?.id ? `audio/${chapter.id}.wav` : null;

    if (!hasElevenLabsKey && !preRenderedAudioUrl) {
      setAudioError(
        'Please add your ElevenLabs API Key in Menu → API Keys & Audio Settings to play neural narration.'
      );
      return;
    }

    // 2. If paused mid-chapter on the same stream, resume (or seek & resume) immediately inside the gesture!
    if (
      el &&
      activeStreamSourceRef.current &&
      !isSilentUnlockActiveRef.current &&
      el.duration > 0.5
    ) {
      el.playbackRate = playbackRateRef.current;
      if (hasExplicitSeek) {
        const targetTime = overrideSeekRatio * el.duration;
        el.currentTime = targetTime;
        setCurrentTime(targetTime);
      } else if (el.currentTime >= el.duration - 0.1) {
        el.currentTime = 0;
        setCurrentTime(0);
      }
      try {
        await el.play();
        setIsPlaying(true);
        return;
      } catch {
        // fall through to regenerate/play
      }
    }

    // 3. If we already cached an ElevenLabs Blob URL for this chapter in this session, play it in 0ms!
    if (cachedAudioKey && cachedAudioKey.startsWith('blob:')) {
      const ok = await playUrlOnHtmlAudio(
        cachedAudioKey,
        hasExplicitSeek ? overrideSeekRatio : null
      );
      if (ok) return;
    }

    // 4. If no ElevenLabs API key is entered, play the bundled pre-rendered audio file!
    if (!hasElevenLabsKey && preRenderedAudioUrl) {
      const ok = await playUrlOnHtmlAudio(
        preRenderedAudioUrl,
        hasExplicitSeek ? overrideSeekRatio : null
      );
      if (ok) return;
    }

    if (hasExplicitSeek) {
      pendingSeekRatioRef.current = overrideSeekRatio;
    }

    // 5. Unlock <audio> synchronously with a 0.25s silent Blob URL
    //    AND fetch the ElevenLabs neural MP3 directly from the browser (`https://api.elevenlabs.io/...`)!
    if (el) {
      try {
        isSilentUnlockActiveRef.current = true;
        el.loop = false;
        el.src = getSilentUnlockBlobUrl();
        const unlockP = el.play();
        if (unlockP && typeof unlockP.catch === 'function') unlockP.catch(() => {});
      } catch {
        // ignore
      }
    }

    setIsGeneratingAudio(true);
    try {
      const blobUrl = await synthesizeChapterWithElevenLabs({
        chapter,
        elevenLabsApiKey: settings.elevenLabsApiKey,
        voiceId: settings.elevenLabsVoiceId || DEFAULT_ELEVENLABS_VOICE_ID,
      });
      onCacheChapterBlobUrl(chapter.id, blobUrl);
      await playUrlOnHtmlAudio(
        blobUrl,
        hasExplicitSeek ? overrideSeekRatio : pendingSeekRatioRef.current
      );
    } catch (err) {
      console.warn('ElevenLabs synthesis error:', err);
      setAudioError(err?.message || 'ElevenLabs narration failed. Please try again.');
    } finally {
      setIsGeneratingAudio(false);
      isSilentUnlockActiveRef.current = false;
    }
  };

  /**
   * Jumps directly to the beginning of sentence `targetIdx` (0..N-1).
   * - If audio is already loaded (playing or paused), seeks `<audio>` to the exact start of that sentence.
   * - If audio hasn't been generated/loaded yet, triggers synthesis and jumps to that sentence once ready.
   */
  const handleJumpToSentence = (targetIdx) => {
    if (!sentenceSegments.length) return;
    const clampedIdx = Math.max(0, Math.min(sentenceSegments.length - 1, targetIdx));
    const seg = sentenceSegments[clampedIdx];
    if (!seg) return;

    setActiveSpokenSentenceIdx(clampedIdx);

    const el = htmlAudioRef.current;
    if (
      el &&
      activeStreamSourceRef.current &&
      !isSilentUnlockActiveRef.current &&
      Number.isFinite(el.duration) &&
      el.duration > 0.5
    ) {
      const newTime = seg.startRatio * el.duration;
      el.currentTime = newTime;
      setCurrentTime(newTime);
      return;
    }

    // Audio not loaded yet: start loading and seek to this sentence's startRatio
    handlePlayPause(seg.startRatio);
  };

  const handleSpeedChange = (newRate) => {
    playbackRateRef.current = newRate;
    setPlaybackRate(newRate);
    if (htmlAudioRef.current) {
      htmlAudioRef.current.playbackRate = newRate;
    }
  };

  return (
    <div className="rounded-xl border border-[#D5E1E8] bg-[#F8FBFD] px-3 py-2.5 shadow-2xs">
      {/* Persistent HTML5 Audio Element playing ElevenLabs Neural Blob URLs */}
      <audio
        ref={htmlAudioRef}
        preload="auto"
        playsInline
        className="hidden"
        onLoadedMetadata={(e) => {
          if (isSilentUnlockActiveRef.current) return;
          const d = e.currentTarget.duration;
          if (Number.isFinite(d) && d > 0.5) {
            setDuration(d);
            if (pendingSeekRatioRef.current !== null) {
              const seekTime = pendingSeekRatioRef.current * d;
              e.currentTarget.currentTime = seekTime;
              setCurrentTime(seekTime);
              const sIdx = getSentenceIndexAtTime(chapter?.sentences, seekTime, d);
              if (sIdx !== null) {
                setActiveSpokenSentenceIdx(sIdx);
              }
              pendingSeekRatioRef.current = null;
            }
          }
        }}
        onPlaying={() => {
          if (isSilentUnlockActiveRef.current) return;
          setIsGeneratingAudio(false);
          setIsPlaying(true);
          if (activeSpokenSentenceIdx === null) {
            setActiveSpokenSentenceIdx(0);
          }
        }}
        onTimeUpdate={(e) => {
          if (isSilentUnlockActiveRef.current) return;
          const t = e.currentTarget.currentTime;
          const d = e.currentTarget.duration;
          setCurrentTime(t);
          if (Number.isFinite(d) && d > 0.5) {
            setDuration(d);
            const sIdx = getSentenceIndexAtTime(chapter?.sentences, t, d);
            if (sIdx !== null) {
              setActiveSpokenSentenceIdx(sIdx);
            }
          }
        }}
        onEnded={() => {
          if (isSilentUnlockActiveRef.current) return;
          setIsGeneratingAudio(false);
          setIsPlaying(false);
          setCurrentTime(0);
          setActiveSpokenSentenceIdx(null);
        }}
        onError={() => {
          if (isSilentUnlockActiveRef.current) return;
          setIsGeneratingAudio(false);
        }}
      />

      <div className="flex flex-wrap items-center justify-between gap-2">
        {/* Play Full Chapter, Sentence Step Controls & Stop Buttons */}
        <div className="flex flex-wrap items-center gap-1.5">
          <button
            type="button"
            onClick={() => handlePlayPause()}
            disabled={isGeneratingAudio}
            className="flex items-center gap-2 rounded-lg bg-[#234E68] px-3.5 py-1.5 text-xs font-semibold text-white shadow-2xs transition hover:bg-[#1B3E54] disabled:opacity-60"
          >
            {isGeneratingAudio ? (
              <>
                <Loader2 className="h-3.5 w-3.5 animate-spin" />
                <span>Loading Audio...</span>
              </>
            ) : isPlaying ? (
              <>
                <Pause className="h-3.5 w-3.5" />
                <span>Pause Narration</span>
              </>
            ) : (
              <>
                <Play className="h-3.5 w-3.5 fill-current" />
                <span>
                  {currentTime > 0.1 ? 'Resume Narration' : 'Play Full Chapter'}
                </span>
              </>
            )}
          </button>

          {/* Quick Sentence Navigation: Previous / Replay Start of Current Sentence / Next */}
          {sentenceSegments.length > 0 && (
            <div className="flex items-center rounded-lg border border-[#D5E1E8] bg-white p-0.5 shadow-2xs">
              <button
                type="button"
                onClick={() => handleJumpToSentence(Math.max(0, currentSentenceIdx - 1))}
                disabled={isGeneratingAudio || currentSentenceIdx <= 0}
                className="flex items-center gap-0.5 rounded-md px-2 py-1 text-[11px] font-medium text-[#355263] transition hover:bg-[#EDF4F8] disabled:opacity-40"
                title="Previous sentence"
              >
                <ChevronLeft className="h-3.5 w-3.5" />
                <span className="hidden sm:inline">Prev</span>
              </button>

              <button
                type="button"
                onClick={() => handleJumpToSentence(currentSentenceIdx)}
                disabled={isGeneratingAudio}
                className="flex items-center gap-1 border-x border-[#E6ECEA] px-2.5 py-1 text-[11px] font-semibold text-[#234E68] transition hover:bg-[#EDF4F8] disabled:opacity-40"
                title="Restart current sentence from the beginning"
              >
                <RotateCcw className="h-3 w-3" />
                <span>Replay S{currentSentenceIdx + 1}</span>
              </button>

              <button
                type="button"
                onClick={() =>
                  handleJumpToSentence(
                    Math.min(sentenceSegments.length - 1, currentSentenceIdx + 1)
                  )
                }
                disabled={
                  isGeneratingAudio || currentSentenceIdx >= sentenceSegments.length - 1
                }
                className="flex items-center gap-0.5 rounded-md px-2 py-1 text-[11px] font-medium text-[#355263] transition hover:bg-[#EDF4F8] disabled:opacity-40"
                title="Next sentence"
              >
                <span className="hidden sm:inline">Next</span>
                <ChevronRight className="h-3.5 w-3.5" />
              </button>
            </div>
          )}

          {(isPlaying || currentTime > 0.1) && (
            <button
              type="button"
              onClick={() => stopAllPlayback(true)}
              className="flex items-center gap-1 rounded-lg border border-[#DCE2DF] bg-[#F7F9F8] px-2.5 py-1.5 text-xs font-medium text-[#5C6661] hover:bg-[#EEF2F0] hover:text-[#181D1B]"
              title="Stop and reset to 00:00"
            >
              <Square className="h-3 w-3 fill-current" />
              <span>Stop</span>
            </button>
          )}
        </div>

        {/* Speed Selector */}
        <div className="flex items-center gap-1.5">
          <Volume2 className="h-4 w-4 text-[#87928D]" />
          <span className="text-[11px] font-medium text-[#5C6661]">Speed:</span>
          <div className="flex rounded-lg border border-[#D5E1E8] bg-[#F4F8FA] p-0.5">
            {[0.8, 0.95, 1.0, 1.15].map((rate) => (
              <button
                key={rate}
                type="button"
                onClick={() => handleSpeedChange(rate)}
                className={`rounded-md px-2 py-0.5 text-[11px] font-medium transition ${
                  playbackRate === rate
                    ? 'bg-[#234E68] text-white'
                    : 'text-[#5C6661] hover:text-[#181D1B]'
                }`}
              >
                {rate}x
              </button>
            ))}
          </div>
        </div>
      </div>

      {/* YouTube-Style Progress Line with Sentence Tick Markings */}
      {sentenceSegments.length > 0 && (
        <div className="mt-2.5 border-t border-[#E6ECEA] pt-2.5">
          <div className="flex items-center gap-3">
            <span className="w-10 shrink-0 font-mono text-[11px] font-semibold text-[#1E3F54]">
              {formatTime(currentTime)}
            </span>

            {/* Thin YouTube-Style Segmented Line (2px gap markings between sentences) */}
            <div
              className="relative flex flex-1 items-center gap-[3px] py-2 cursor-pointer"
              role="group"
              aria-label="Narration progress bar with sentence markings"
            >
              {sentenceSegments.map((seg) => {
                const overallProgress =
                  duration > 0.2 ? Math.max(0, Math.min(1, currentTime / duration)) : 0;

                let segmentFillPct = 0;
                if (duration > 0.2) {
                  if (overallProgress >= seg.endRatio) {
                    segmentFillPct = 100;
                  } else if (overallProgress > seg.startRatio) {
                    segmentFillPct =
                      ((overallProgress - seg.startRatio) /
                        Math.max(0.001, seg.endRatio - seg.startRatio)) *
                      100;
                  }
                }

                const isCurrentSentence =
                  (isPlaying || currentTime > 0.05 || activeSpokenSentenceIdx !== null) &&
                  currentSentenceIdx === seg.index;

                return (
                  <button
                    key={seg.index}
                    type="button"
                    onClick={() => handleJumpToSentence(seg.index)}
                    style={{ flexGrow: Math.max(1, Math.round(seg.weightRatio * 100)) }}
                    title={`Sentence ${seg.index + 1}: "${seg.text}"`}
                    className={`group relative h-1.5 hover:h-2.5 transition-all rounded-[2px] bg-[#D5E1E8] overflow-visible focus:outline-none ${
                      isCurrentSentence ? 'h-2 bg-[#C8D8E2]' : ''
                    }`}
                  >
                    {/* Filled Progress Line Inside This Sentence Segment */}
                    <div
                      className={`pointer-events-none absolute inset-y-0 left-0 rounded-[2px] transition-all duration-75 ${
                        isCurrentSentence ? 'bg-[#EA580C]' : 'bg-[#234E68]'
                      }`}
                      style={{ width: `${Math.min(100, Math.max(0, segmentFillPct))}%` }}
                    />

                    {/* Playhead Scrubber Dot on the Currently Playing Sentence */}
                    {isCurrentSentence && duration > 0.2 && (
                      <span
                        className="pointer-events-none absolute top-1/2 -translate-y-1/2 -translate-x-1/2 h-3 w-3 rounded-full bg-[#EA580C] shadow-xs ring-2 ring-white transition-all duration-75"
                        style={{ left: `${Math.min(100, Math.max(0, segmentFillPct))}%` }}
                      />
                    )}
                  </button>
                );
              })}
            </div>

            <span className="w-10 shrink-0 text-right font-mono text-[11px] text-[#5C6661]">
              {duration > 0.2 ? formatTime(duration) : '00:00'}
            </span>
          </div>

          {activeSpokenSentenceIdx !== null && isPlaying && (
            <div className="mt-1 flex items-center justify-between text-[11px] text-[#234E68]">
              <div className="flex items-center gap-1.5 min-w-0">
                <span className="inline-block h-1.5 w-1.5 shrink-0 rounded-full bg-[#EA580C] animate-ping" />
                <span className="truncate">
                  Sentence {activeSpokenSentenceIdx + 1} of {sentenceSegments.length}
                </span>
              </div>
              <span className="text-[10px] text-[#6C7A74] shrink-0">
                Click any marked segment on the line to restart that sentence
              </span>
            </div>
          )}
        </div>
      )}

      {!hasElevenLabsKey && (
        <div className="mt-2 flex items-center justify-between gap-2 rounded-lg border border-[#C6D8E4] bg-[#F1F6FA] px-3 py-1.5 text-xs text-[#1E3F54]">
          <div className="flex items-center gap-2">
            <span className="inline-block h-2 w-2 rounded-full bg-[#234E68]" />
            <span>
              <strong>Pre-recorded audio ready</strong> — click <em>Play Full Chapter</em> to listen. (To use live AI voices, add your ElevenLabs API Key in <em>Menu → Settings</em>).
            </span>
          </div>
        </div>
      )}

      {audioError && (
        <div className="mt-2 flex items-start gap-2 rounded-lg border border-[#E5CFCB] bg-[#FAF4F2] px-3 py-1.5 text-xs text-[#7A3E33]">
          <AlertCircle className="mt-0.5 h-3.5 w-3.5 shrink-0 text-[#8C4A3E]" />
          <span>{audioError}</span>
        </div>
      )}
    </div>
  );
}
