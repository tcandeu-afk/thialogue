/**
 * Deterministic shuffle helper so multiple-choice options and sentence-order tiles
 * never put the correct answer in a predictable slot.
 */
function deterministicShuffle(array, seedNum) {
  const arr = [...array];
  let s = (seedNum || 1) * 9301 + 49297;
  for (let i = arr.length - 1; i > 0; i--) {
    s = (s * 9301 + 49297) % 233280;
    const j = s % (i + 1);
    const temp = arr[i];
    arr[i] = arr[j];
    arr[j] = temp;
  }
  return arr;
}

/**
 * Strips character names from dynamic fallback sentences (for AI-generated Chapters 4+)
 * so learners can never cheat by matching character names between English and the target language.
 */
const CHARACTER_NAME_REPLACEMENTS = [
  { regex: /\b(Clara|Sofia|Elena)\b/g, target: 'Mon amie', en: 'My friend' },
  { regex: /\b(Lucas|Henri|Paul|Marco|Mateo)\b/g, target: 'Mon ami', en: 'My friend' },
  { regex: /민호|지수/g, target: '친구', en: 'My friend' },
  { regex: /遥|蓮/g, target: '友人', en: 'My friend' },
  { regex: /เลียม|พลอย|สมชาย/g, target: 'เพื่อนของฉัน', en: 'My friend' }
];

function anonymizeCharacterNames(text, mode = 'en') {
  if (!text) return '';
  let result = text;
  for (const rule of CHARACTER_NAME_REPLACEMENTS) {
    result = result.replace(rule.regex, mode === 'en' ? rule.en : rule.target);
  }
  return result;
}

/**
 * Interleaves the 5 cognitive modalities (6 items each = 30 total) into a balanced sequence.
 * - First 15 exercises: 3 of each modality (Cloze, Pragmatic Dialogue, Blind Audio, Grammar Contrast, Sentence Assembly)
 * - Full 30 exercises: All 6 of each modality
 * Every single exercise uses a 100% unique sentence — zero repetition across the entire checkpoint!
 */
function buildInterleavedExerciseSet(curatedData, chapter, languageCode, chapterNum) {
  const seedBase = (chapterNum || 1) * 37 + (languageCode?.charCodeAt(0) || 100);
  const drills = curatedData?.drills;

  if (drills && drills.cloze && drills.dialogue && drills.audio_comprehension && drills.grammar_contrast && drills.sentence_order) {
    const clozeList = drills.cloze.map((q, idx) => ({
      id: `cloze-${idx}`,
      type: 'cloze',
      badgeLabel: 'Context Transfer (Cloze)',
      promptEnglish: q.promptEnglish,
      sentenceParts: q.sentenceParts,
      correctAnswer: q.correctAnswer,
      options: deterministicShuffle(q.options, seedBase + idx * 11 + 1),
      fullSentence: `${q.sentenceParts[0]}${q.correctAnswer}${q.sentenceParts[1]}`,
      explanation: q.explanation
    }));

    const dialogueList = drills.dialogue.map((q, idx) => ({
      id: `dialogue-${idx}`,
      type: 'dialogue',
      badgeLabel: 'Pragmatic Mini-Dialogue',
      speakerA: q.speakerA,
      speakerAEnglish: q.speakerAEnglish,
      promptEnglish: q.promptEnglish,
      correctAnswer: q.correctAnswer,
      options: deterministicShuffle(q.options, seedBase + idx * 13 + 2),
      fullSentence: q.correctAnswer,
      explanation: q.explanation
    }));

    const audioList = drills.audio_comprehension.map((q, idx) => ({
      id: `audio-${idx}`,
      type: 'audio_comprehension',
      badgeLabel: 'Blind Audio Decoding',
      promptEnglish: 'Listen to the spoken sentence (without reading!) and choose the exact meaning:',
      audioSentence: q.audioSentence,
      correctAnswer: q.correctAnswer,
      options: deterministicShuffle(q.options, seedBase + idx * 17 + 3),
      fullSentence: q.audioSentence,
      explanation: q.explanation
    }));

    const grammarList = drills.grammar_contrast.map((q, idx) => ({
      id: `grammar-${idx}`,
      type: 'grammar_contrast',
      badgeLabel: 'Form-Focused Pattern Check',
      promptEnglish: q.promptEnglish,
      correctAnswer: q.correctAnswer,
      options: deterministicShuffle(q.options, seedBase + idx * 19 + 4),
      fullSentence: q.correctAnswer,
      explanation: q.explanation
    }));

    const orderList = drills.sentence_order.map((q, idx) => {
      let shuffled = deterministicShuffle(q.chunks, seedBase + idx * 23 + 5);
      if (shuffled.every((c, i) => c === q.chunks[i]) && shuffled.length > 1) {
        shuffled = [shuffled[1], shuffled[0], ...shuffled.slice(2)];
      }
      return {
        id: `order-${idx}`,
        type: 'sentence_order',
        badgeLabel: 'Interactive Sentence Assembly',
        promptEnglish: q.promptEnglish,
        correctChunks: q.chunks,
        shuffledChunks: shuffled,
        correctAnswer: q.chunks.join(' '),
        fullSentence: q.chunks.join(' '),
        explanation: q.explanation
      };
    });

    const interleaved = [];
    for (let round = 0; round < 6; round++) {
      if (clozeList[round]) interleaved.push(clozeList[round]);
      if (dialogueList[round]) interleaved.push(dialogueList[round]);
      if (audioList[round]) interleaved.push(audioList[round]);
      if (grammarList[round]) interleaved.push(grammarList[round]);
      if (orderList[round]) interleaved.push(orderList[round]);
    }
    return interleaved;
  }

  return buildDynamicFallbackExercises(chapter, seedBase);
}

function buildDynamicFallbackExercises(chapter, seedBase) {
  const sentences = chapter?.sentences || [];
  const allLexicalTokens = [];
  sentences.forEach((s) => {
    (s.tokens || []).forEach((tok) => {
      if (
        tok?.surface &&
        tok.surface.length >= 2 &&
        !isProperNounOrNonLexicalToken(tok) &&
        tok.contextualMeaning
      ) {
        allLexicalTokens.push(tok);
      }
    });
  });

  const exercises = [];
  sentences.forEach((s, idx) => {
    const rawTarget = s.fullSentence || s.target || '';
    const rawEn = s.englishTranslation || s.english || '';
    const cleanTarget = anonymizeCharacterNames(rawTarget, 'target');
    const cleanEn = anonymizeCharacterNames(rawEn, 'en');
    const validTokens = (s.tokens || []).filter(
      (tok) => tok?.surface && tok.surface.length >= 2 && !isProperNounOrNonLexicalToken(tok)
    );
    if (validTokens.length >= 3) {
      const targetTok = validTokens[Math.floor(validTokens.length / 2)];
      const answer = targetTok.surface;
      const distractors = allLexicalTokens
        .map((t) => t.surface)
        .filter((w, i, self) => w.toLowerCase() !== answer.toLowerCase() && self.indexOf(w) === i)
        .slice(idx, idx + 3);
      while (distractors.length < 3) distractors.push(`mot-${distractors.length + 1}`);
      const parts = cleanTarget.split(answer);
      if (parts.length >= 2) {
        exercises.push({
          id: `dyn-cloze-${idx}`,
          type: 'cloze',
          badgeLabel: 'Context Transfer (Cloze)',
          promptEnglish: cleanEn,
          sentenceParts: [parts[0], parts.slice(1).join(answer)],
          correctAnswer: answer,
          options: deterministicShuffle([answer, ...distractors.slice(0, 3)], seedBase + idx),
          fullSentence: cleanTarget,
          explanation: `« ${answer} » means '${targetTok.contextualMeaning || ''}'.`
        });
      }
    }
  });
  return exercises;
}

function ChapterRecapSection({
  profile,
  languageCode: propLangCode,
  chapter,
  chapterIndex = 0,
  totalChapters = 3,
  onSelectChapterIndex,
  onGenerateNextChapter,
  isGeneratingChapter = false,
  onPlaySentenceAudio: propPlaySentenceAudio,
  onNextChapter: propNextChapter,
  hasNextChapter: propHasNextChapter,
  onGenerateChapter: propGenerateChapter
}) {
  const languageCode = propLangCode || profile?.id || 'fr';
  const bcp47 = profile?.bcp47 || 'fr-FR';
  const chapterNum = chapter?.chapterNumber || chapter?.number || (chapterIndex ?? 0) + 1;
  const langBank = COURSE_RECAP_BANK[languageCode] || {};
  const curatedData = langBank[chapterNum];

  const hasNextChapter =
    propHasNextChapter !== undefined
      ? propHasNextChapter
      : (chapterIndex ?? 0) + 1 < (totalChapters || 1);

  const onNextChapter =
    propNextChapter ||
    (() => {
      if (onSelectChapterIndex) {
        onSelectChapterIndex((chapterIndex ?? 0) + 1);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    });

  const onGenerateChapter = propGenerateChapter || onGenerateNextChapter;

  const onPlaySentenceAudio =
    propPlaySentenceAudio ||
    ((text, speed = 1.0) => {
      speakSingleWord(text, bcp47, speed);
    });

  const allExercises = useMemo(
    () => buildInterleavedExerciseSet(curatedData, chapter, languageCode, chapterNum),
    [curatedData, chapter, languageCode, chapterNum]
  );

  const [exerciseCountMode, setExerciseCountMode] = useState(15); // 15 or 30
  const [viewMode, setViewMode] = useState('focused'); // 'focused' (1 card at a time) or 'list' (all cards)
  const [currentStepIdx, setCurrentStepIdx] = useState(0);
  const [selectedAnswers, setSelectedAnswers] = useState({});
  const [assembledTiles, setAssembledTiles] = useState({});
  const [revealedTranscripts, setRevealedTranscripts] = useState({});
  const [filterType, setFilterType] = useState('all');
  const [showMethodologyInfo, setShowMethodologyInfo] = useState(false);

  // Reset state when chapter or language changes
  useEffect(() => {
    setSelectedAnswers({});
    setAssembledTiles({});
    setRevealedTranscripts({});
    setExerciseCountMode(15);
    setFilterType('all');
    setCurrentStepIdx(0);
  }, [languageCode, chapterNum]);

  const activeExercises = useMemo(() => {
    const sliced = allExercises.slice(0, exerciseCountMode);
    if (filterType === 'all') return sliced;
    return sliced.filter((q) => q.type === filterType);
  }, [allExercises, exerciseCountMode, filterType]);

  // Keep currentStepIdx in bounds when switching filter or 15/30 mode
  useEffect(() => {
    if (currentStepIdx >= activeExercises.length) {
      setCurrentStepIdx(0);
    }
  }, [activeExercises.length, currentStepIdx]);

  const totalQuestions = Math.min(exerciseCountMode, allExercises.length);
  const activeSlice = allExercises.slice(0, totalQuestions);
  const answeredCount = activeSlice.filter((q) => selectedAnswers[q.id] !== undefined).length;
  const correctCount = activeSlice.filter((q) => selectedAnswers[q.id] === q.correctAnswer).length;
  const allCompleted = totalQuestions > 0 && answeredCount === totalQuestions;

  const handleSelectOption = (qId, option) => {
    if (selectedAnswers[qId] !== undefined) return;
    setSelectedAnswers((prev) => ({ ...prev, [qId]: option }));
  };

  const handleTileClick = (q, tileText, sourceIdx) => {
    if (selectedAnswers[q.id] !== undefined) return;
    const currentList = assembledTiles[q.id] || [];
    if (currentList.some((item) => item.sourceIdx === sourceIdx)) return;

    const updated = [...currentList, { text: tileText, sourceIdx }];
    setAssembledTiles((prev) => ({ ...prev, [q.id]: updated }));

    if (updated.length === q.correctChunks.length) {
      const candidate = updated.map((t) => t.text).join(' ');
      setSelectedAnswers((prev) => ({ ...prev, [q.id]: candidate }));
    }
  };

  const handleRemovePlacedTile = (q, placedIdx) => {
    if (selectedAnswers[q.id] !== undefined) return;
    const currentList = assembledTiles[q.id] || [];
    const updated = currentList.filter((_, idx) => idx !== placedIdx);
    setAssembledTiles((prev) => ({ ...prev, [q.id]: updated }));
  };

  const handleResetQuestion = (qId) => {
    setSelectedAnswers((prev) => {
      const next = { ...prev };
      delete next[qId];
      return next;
    });
    setAssembledTiles((prev) => {
      const next = { ...prev };
      delete next[qId];
      return next;
    });
  };

  const handleResetQuiz = () => {
    setSelectedAnswers({});
    setAssembledTiles({});
    setRevealedTranscripts({});
    setCurrentStepIdx(0);
  };

  const toggleTranscriptHint = (qId) => {
    setRevealedTranscripts((prev) => ({ ...prev, [qId]: !prev[qId] }));
  };

  const getTypeStyle = (type) => {
    switch (type) {
      case 'cloze':
        return {
          icon: Puzzle,
          bg: 'bg-emerald-50 text-emerald-800 border-emerald-200',
          accent: 'text-emerald-600'
        };
      case 'dialogue':
        return {
          icon: MessageSquare,
          bg: 'bg-blue-50 text-blue-800 border-blue-200',
          accent: 'text-blue-600'
        };
      case 'audio_comprehension':
        return {
          icon: Headphones,
          bg: 'bg-purple-50 text-purple-800 border-purple-200',
          accent: 'text-purple-600'
        };
      case 'grammar_contrast':
        return {
          icon: Scale,
          bg: 'bg-amber-50 text-amber-800 border-amber-200',
          accent: 'text-amber-600'
        };
      case 'sentence_order':
        return {
          icon: ListOrdered,
          bg: 'bg-rose-50 text-rose-800 border-rose-200',
          accent: 'text-rose-600'
        };
      default:
        return {
          icon: Sparkles,
          bg: 'bg-stone-100 text-stone-700 border-stone-200',
          accent: 'text-stone-600'
        };
    }
  };

  const vocabReuses = curatedData?.vocabReuses || [];
  const construction = curatedData?.construction || null;
  const subtitle =
    curatedData?.subtitle ||
    'Contextual Recombination, Sentence Patterns & Multi-Modal Active Recall';

  const exercisesToRender =
    viewMode === 'focused'
      ? activeExercises.slice(currentStepIdx, currentStepIdx + 1)
      : activeExercises;

  return (
    <section
      className="mt-10 pt-8 border-t border-[#E2E7E4]"
      aria-label="Chapter Consolidation & Active Recall"
    >
      {/* Streamlined Header Banner */}
      <div className="rounded-2xl bg-gradient-to-br from-[#FDF8F3] via-[#FAF6F0] to-[#F5F7F6] border border-[#E8D7C3] p-5 sm:p-6 shadow-sm">
        <div className="flex flex-wrap items-center justify-between gap-4">
          <div className="space-y-1.5 max-w-xl">
            <div className="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-orange-600/10 border border-orange-500/20 text-orange-800 text-[11px] font-bold tracking-wider uppercase">
              <Sparkles className="w-3.5 h-3.5 text-orange-600 shrink-0" />
              <span>Chapter {chapterNum} Consolidation &amp; Transfer Lab</span>
            </div>
            <h2 className="text-xl sm:text-2xl font-serif font-bold text-[#181D1B] tracking-tight">
              Beyond the Story: Recombine &amp; Master
            </h2>
            <p className="text-xs sm:text-sm text-[#4A5550] leading-relaxed">
              <span className="font-semibold text-[#181D1B]">Grammar &amp; Lexical Focus:</span>{' '}
              {subtitle}
            </p>
          </div>

          {/* Score Pill */}
          <div className="flex items-center gap-3 bg-white px-4 py-2.5 rounded-xl border border-[#DCE2DF] shadow-sm shrink-0">
            <div className="w-10 h-10 rounded-xl bg-orange-50 border border-orange-200 flex items-center justify-center text-orange-600 font-bold text-sm">
              {correctCount}/{totalQuestions}
            </div>
            <div>
              <div className="text-[10px] font-bold uppercase tracking-wider text-stone-400">
                Recall Progress
              </div>
              <div className="text-xs sm:text-sm font-semibold text-[#181D1B]">
                {allCompleted
                  ? correctCount === totalQuestions
                    ? 'Perfect Mastery!'
                    : 'Checkpoint Complete!'
                  : `${answeredCount} of ${totalQuestions} completed`}
              </div>
            </div>
          </div>
        </div>

        {/* Compact Expandable SLA Methodology Note */}

                        onClick={() => onPlaySentenceAudio(q.fullSentence, 1.0)}

                        title="Listen to the complete sentence"
                      >
                        <Volume2 className="w-3.5 h-3.5 text-orange-600" />
                        <span>Play Audio</span>
                      </button>
                    )}
                  </div>

                  {/* Multiple Choice Options Grid */}
                  {q.type !== 'sentence_order' && (
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5 pt-1">
                      {q.options.map((opt, oIdx) => {
                        const isSelected = chosen === opt;
                        const isOptionCorrect = opt === q.correctAnswer;

                        let btnClass =
                          'bg-[#F8FAF9] hover:bg-orange-50/70 border-[#DCE2DF] hover:border-orange-300 text-[#181D1B]';
                        if (isAnswered) {
                          if (isOptionCorrect) {
                            btnClass =
                              'bg-emerald-600 border-emerald-600 text-white font-bold shadow-sm';
                          } else if (isSelected && !isOptionCorrect) {
                            btnClass = 'bg-rose-600 border-rose-600 text-white font-semibold';
                          } else {
                            btnClass =
                              'bg-stone-100/70 border-stone-200/60 text-stone-400 opacity-70';
                          }
                        }

                        return (
                          <button
                            key={oIdx}
                            type="button"
                            disabled={isAnswered}
                            onClick={() => handleSelectOption(q.id, opt)}
                            className={`px-4 py-3 rounded-xl border text-xs sm:text-sm font-medium transition-all flex items-center justify-between gap-2 text-left ${
                              !isAnswered ? 'cursor-pointer' : 'cursor-default'
                            } ${btnClass}`}
                          >
                            <span className="leading-snug">{opt}</span>
                            {isAnswered && isOptionCorrect && (
                              <CheckCircle2 className="w-4 h-4 shrink-0 text-white" />
                            )}
                            {isAnswered && isSelected && !isOptionCorrect && (
                              <XCircle className="w-4 h-4 shrink-0 text-white" />
                            )}
                          </button>
                        );
                      })}
                    </div>
                  )}

                  {/* Pedagogical Feedback Explanation after answering */}
                  {isAnswered && (
                    <div
                      className={`mt-1 pt-3 border-t text-xs sm:text-sm flex flex-col sm:flex-row sm:items-center justify-between gap-3 ${
                        isCorrect
                          ? 'border-emerald-200 text-emerald-950'
                          : 'border-rose-200 text-rose-950'
                      }`}
                    >
                      <div className="leading-relaxed">
                        <span className="font-bold mr-1.5">
                          {isCorrect ? 'Spot on!' : `Correct answer: « ${q.correctAnswer} » —`}
                        </span>
                        <span>{q.explanation}</span>
                      </div>

                      <div className="flex items-center gap-2 shrink-0 self-end sm:self-auto">
                        {!isCorrect && (
                          <button
                            type="button"
                            onClick={() => handleResetQuestion(q.id)}
                            className="inline-flex items-center gap-1 px-3 py-1.5 rounded-xl bg-white hover:bg-rose-50 border border-rose-300 text-rose-800 font-semibold text-xs cursor-pointer"
                          >
                            <RotateCcw className="w-3.5 h-3.5" />
                            <span>Try Again</span>
                          </button>
                        )}
                      </div>
                    </div>
                  )}

                  {/* Focused Deck Prev / Next Navigation Footer */}
                  {viewMode === 'focused' && activeExercises.length > 1 && (
                    <div className="mt-2 pt-3 border-t border-[#E8ECEA] flex items-center justify-between gap-2">
                      <button
                        type="button"
                        disabled={currentStepIdx <= 0}
                        onClick={() => setCurrentStepIdx((i) => Math.max(0, i - 1))}
                        className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl border border-[#DCE2DF] bg-[#F8FAF9] text-xs font-semibold text-[#4A5550] hover:text-[#181D1B] disabled:opacity-40 cursor-pointer"
                      >
                        <ChevronLeft className="w-4 h-4" />
                        <span>Previous</span>
                      </button>

                      <span className="text-xs font-medium text-[#737F79]">
                        {answeredCount} of {totalQuestions} answered
                      </span>

                      <button
                        type="button"
                        disabled={currentStepIdx >= activeExercises.length - 1}
                        onClick={() =>
                          setCurrentStepIdx((i) => Math.min(activeExercises.length - 1, i + 1))
                        }
                        className={`inline-flex items-center gap-1.5 px-4 py-1.5 rounded-xl text-xs font-semibold transition-colors cursor-pointer disabled:opacity-40 ${
                          isAnswered
                            ? 'bg-orange-600 hover:bg-orange-500 text-white shadow-sm'
                            : 'border border-[#DCE2DF] bg-[#F8FAF9] text-[#181D1B] hover:bg-[#EEF2F0]'
                        }`}
                      >
                        <span>Next Exercise</span>
                        <ChevronRight className="w-4 h-4" />
                      </button>
                    </div>
                  )}
                </div>
              </div>
            );
          })}
        </div>
      </div>

      {/* ===================================================================== */}
      {/* CHAPTER COMPLETION / NEXT CHAPTER CTA                                 */}
      {/* ===================================================================== */}
      <div className="mt-8 rounded-2xl bg-[#181D1B] text-white p-5 sm:p-6 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 shadow-sm">
        <div className="flex items-start gap-3.5">
          <div className="w-10 h-10 rounded-xl bg-orange-500/20 border border-orange-400/30 flex items-center justify-center text-orange-400 shrink-0">
            <Award className="w-5 h-5" />
          </div>
          <div>
            <h4 className="text-base font-serif font-bold text-white">
              {allCompleted
                ? `Great job completing Chapter ${chapterNum}'s Transfer Lab!`
                : `Ready for the next part of the story?`}
            </h4>
            <p className="text-xs sm:text-sm text-stone-300 mt-0.5">
              {allCompleted
                ? `You scored ${correctCount} out of ${totalQuestions} across all 5 active-recall modalities.`
                : exerciseCountMode === 15
                ? `Step through the 15 exercises above or toggle "30 Deep" for 15 extra transfer drills.`
                : `Complete all 30 multi-style transfer exercises above to lock in this chapter's patterns.`}
            </p>
          </div>
        </div>

        <div className="flex items-center gap-3 w-full sm:w-auto justify-end shrink-0">
          {hasNextChapter ? (
            <button
              type="button"
              onClick={onNextChapter}
              className="w-full sm:w-auto inline-flex items-center justify-center gap-2 px-5 py-2.5 rounded-xl bg-orange-600 hover:bg-orange-500 text-white font-semibold text-xs sm:text-sm transition-colors shadow-sm cursor-pointer"
            >
              <span>Continue to Chapter {chapterNum + 1}</span>
              <ArrowRight className="w-4 h-4" />
            </button>
          ) : (
            onGenerateChapter && (
              <button
                type="button"
                onClick={onGenerateChapter}
                className="w-full sm:w-auto inline-flex items-center justify-center gap-2 px-5 py-2.5 rounded-xl bg-orange-600 hover:bg-orange-500 text-white font-semibold text-xs sm:text-sm transition-colors shadow-sm cursor-pointer"
              >
                <Sparkles className="w-4 h-4" />
                <span>Generate Chapter {chapterNum + 1} with AI</span>
              </button>
            )
          )}
        </div>
      </div>
    </section>
  );
}


// ==================== src/components/InteractiveReader.jsx ====================








function InteractiveReader({
  profile,
  chapter,
  chapters = [],
  chapterIndex,
  totalChapters,
  onSelectChapterIndex,
  onDeleteChapter,
  onSelectDifficultyLevel,
  readerOnlyMode,
  onToggleReaderOnlyMode,
  strictMode,
  phoneticAid,
  showEnglishTranslation,
  onWordClickAddVocab,
  onGenerateNextChapter,
  onRegenerateCurrentChapter,
  isGeneratingChapter,
  generationError,
  activeSpokenSentenceIdx,
  onTranslateSentence,
}) {
  const [selectedTokenInfo, setSelectedTokenInfo] = useState(null);
  const [openGrammarNotes, setOpenGrammarNotes] = useState({});
  const [fetchedTranslations, setFetchedTranslations] = useState({});
  const [sentenceAudioState, setSentenceAudioState] = useState({
    sentenceKey: null,
    status: 'idle', // 'idle' | 'loading' | 'playing' | 'paused'
  });
  const popupCardRef = useRef(null);

  useEffect(() => {
    setSelectedTokenInfo(null);
    stopSentenceAudio();
    setSentenceAudioState({ sentenceKey: null, status: 'idle' });
  }, [strictMode, chapter?.id, profile?.id]);

  // Close word popup when tapping anywhere outside the popup or pressing Escape
  useEffect(() => {
    if (!selectedTokenInfo) return;
    const handlePointerDownOutside = (e) => {
      if (popupCardRef.current && popupCardRef.current.contains(e.target)) {
        return;
      }
      if (e.target?.closest?.('[data-word-token="true"]')) {
        return;
      }
      setSelectedTokenInfo(null);
    };
    const handleKeyDown = (e) => {
      if (e.key === 'Escape') setSelectedTokenInfo(null);
    };
    document.addEventListener('mousedown', handlePointerDownOutside);
    document.addEventListener('touchstart', handlePointerDownOutside, { passive: true });
    document.addEventListener('keydown', handleKeyDown);
    return () => {
      document.removeEventListener('mousedown', handlePointerDownOutside);
      document.removeEventListener('touchstart', handlePointerDownOutside);
      document.removeEventListener('keydown', handleKeyDown);
    };
  }, [selectedTokenInfo]);

  useEffect(() => {
    setOpenGrammarNotes({});
  }, [chapter?.id]);

  useEffect(() => {
    if (!showEnglishTranslation || strictMode || !chapter?.sentences) return;

    chapter.sentences.forEach((sentence, idx) => {
      const cacheKey = `${chapter.id}-${idx}`;
      if (!sentence.englishTranslation && !fetchedTranslations[cacheKey]) {
        translateToEnglish(sentence.fullSentence, profile.translateCode)
          .then((res) => {
            if (res?.translatedText) {
              setFetchedTranslations((prev) => ({
                ...prev,
                [cacheKey]: res.translatedText,
              }));
            }
          })
          .catch(() => {});
      }
    });
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [showEnglishTranslation, strictMode, chapter?.id, profile?.translateCode]);

  if (!chapter) return null;

  const activeDifficulty = chapter.activeDifficulty || 'maintain';
  const isCJK = profile.id === 'ja';
  const isJapanese = profile.id === 'ja';
  const showPhonetics = isCJK && phoneticAid && !strictMode;
  const showEnglishUnderSentence = showEnglishTranslation && !strictMode;

  const vocabLookup = new Map();
  (profile.vocabBank || []).forEach((entry) => {
    const baseKey = normalizeLexeme(entry.baseForm);
    const wordKey = normalizeLexeme(entry.word);
    if (baseKey) vocabLookup.set(baseKey, entry);
    if (wordKey && !vocabLookup.has(wordKey)) vocabLookup.set(wordKey, entry);
  });

  const getTokenVocabStatus = (token) => {
    const byBase = vocabLookup.get(normalizeLexeme(token.baseForm));
    if (byBase) return byBase;
    return vocabLookup.get(normalizeLexeme(token.surface)) || null;
  };

  const handleTokenClick = (sentenceIndex, tokenIndex, token) => {
    if (strictMode) return;
    if (
      selectedTokenInfo &&
      selectedTokenInfo.sentenceIndex === sentenceIndex &&
      selectedTokenInfo.tokenIndex === tokenIndex
    ) {
      setSelectedTokenInfo(null);
      return;
    }
    setSelectedTokenInfo({ sentenceIndex, tokenIndex, token });
    speakSingleWord(token.surface, profile.bcp47);
    onWordClickAddVocab(token);
  };

  const toggleGrammarNote = (sIdx) => {
    setOpenGrammarNotes((prev) => ({
      ...prev,
      [sIdx]: !prev[sIdx],
    }));
  };

  const selectedVocabEntry = selectedTokenInfo
    ? getTokenVocabStatus(selectedTokenInfo.token)
    : null;

  const difficultyOptions = [
    {
      id: 'simplify',
      shortLabel: 'Too Hard (Simpler)',
      title: 'Too Hard — Make Simpler',
      desc: 'Shorter, easier version of this chapter with simpler sentences',
      icon: SlidersHorizontal,
    },
    {
      id: 'maintain',
      shortLabel: 'Just Right (Standard)',
      title: 'Just Right — Standard',
      desc: 'Original baseline version of this chapter',
      icon: CheckCircle2,
    },
    {
      id: 'challenge',
      shortLabel: 'Too Easy (More Complex)',
      title: 'Too Easy — Challenge Me',
      desc: 'Longer, richer version of this chapter with deeper grammar',
      icon: Flame,
    },
  ];

  return (
    <article
      className={`relative rounded-2xl border border-[#E2E7E4] bg-[#FFFFFF] shadow-2xs ${
        readerOnlyMode ? 'p-5 sm:p-11' : 'p-4 sm:p-9'
      }`}
    >
      {/* Streamlined Editorial Story Header */}
      <div className="mb-6 border-b border-[#E8ECEA] pb-5">
        <div className="flex flex-wrap items-start justify-between gap-4">
          <div className="space-y-1">
            <div className="flex flex-wrap items-center gap-2 text-xs font-semibold uppercase tracking-wider text-[#234E68]">
              <span>{profile.storyTitle}</span>
              <span className="text-[#87928D]">•</span>
              <span className="rounded-md border border-[#C9DCE8] bg-[#F1F6FA] px-2 py-0.5 text-[#1E3F54]">
                {chapter.difficultyLabel || profile.cefrLevel}
              </span>
              {readerOnlyMode && (
                <span className="rounded-md border border-[#CDE0D6] bg-[#EFF6F2] px-2 py-0.5 text-[#285943]">
                  Reader View
                </span>
              )}
            </div>
            <h2 className="font-serif text-2xl font-bold tracking-tight text-[#181D1B] sm:text-3xl">
              {chapter.chapterTitle}
            </h2>
          </div>

          {/* Unified Chapter Pill Switcher */}
          <div className="flex flex-wrap items-center gap-1.5">
            {chapters.map((ch, idx) => {
              const isActive = idx === chapterIndex;
              return (
                <div
                  key={ch.id || idx}
                  className={`inline-flex items-center rounded-xl border text-xs font-semibold transition ${
                    isActive
                      ? 'border-[#234E68] bg-[#234E68] text-white shadow-sm'
                      : 'border-[#DCE2DF] bg-[#F7F9F8] text-[#5C6661] hover:bg-[#EEF2F0] hover:text-[#181D1B]'
                  }`}
                >
                  <button
                    type="button"
                    onClick={() => onSelectChapterIndex(idx)}
                    className="px-3 py-1.5 cursor-pointer focus:outline-none"
                  >
                    Ch. {idx + 1}
                  </button>
                  {!readerOnlyMode && totalChapters > 1 && onDeleteChapter && idx >= 3 && (
                    <button
                      type="button"
                      onClick={(e) => {
                        e.stopPropagation();
                        onDeleteChapter(idx);
                      }}
                      title={`Delete Chapter ${idx + 1}`}
                      aria-label={`Delete Chapter ${idx + 1}`}
                      className={`mr-1 flex h-4 w-4 items-center justify-center rounded-full transition ${
                        isActive
                          ? 'text-[#C6D8E4] hover:bg-white/20 hover:text-white'
                          : 'text-[#87928D] hover:bg-[#DCE2DF] hover:text-[#181D1B]'
                      }`}
                    >
                      <X className="h-3 w-3" />
                    </button>
                  )}
                </div>
              );
            })}

            {!readerOnlyMode && (
              <button
                type="button"
                disabled={isGeneratingChapter}
                onClick={() => onGenerateNextChapter('maintain')}
                className="inline-flex items-center gap-1 rounded-xl border border-dashed border-[#8AAEC4] bg-[#F1F6FA] px-2.5 py-1.5 text-xs font-semibold text-[#234E68] transition hover:bg-[#E4EFF6] disabled:opacity-50 cursor-pointer"
                title="Generate next chapter with AI"
              >
                <span>+ Ch. {totalChapters + 1}</span>
              </button>
            )}

            {readerOnlyMode && onToggleReaderOnlyMode && (
              <button
                type="button"
                onClick={onToggleReaderOnlyMode}
                className="inline-flex items-center gap-1 rounded-xl border border-[#DCE2DF] bg-[#F7F9F8] px-2.5 py-1.5 text-xs font-semibold text-[#4A5550] transition hover:bg-[#EEF2F0] hover:text-[#181D1B]"
                title="Exit Reader View"
              >
                <span>Exit Reader</span>
              </button>
            )}
          </div>
        </div>

        {/* Single Compact Sub-Toolbar: Difficulty Level + Reading Legend (Hidden in Reader View) */}
        {!readerOnlyMode && (
          <div className="mt-4 flex flex-wrap items-center justify-between gap-3 rounded-xl border border-[#E6ECE9] bg-[#F8FAF9] px-3.5 py-2">
            <div className="flex flex-wrap items-center gap-1.5">
              <span className="text-[11px] font-semibold uppercase tracking-wider text-[#5C6661] mr-1">
                Level:
              </span>
              {difficultyOptions.map((opt) => {
                const isSelected = activeDifficulty === opt.id;
                return (
                  <button
                    key={opt.id}
                    type="button"
                    disabled={isGeneratingChapter}
                    onClick={() => onSelectDifficultyLevel?.(opt.id)}
                    className={`inline-flex items-center gap-1 rounded-lg border px-2.5 py-1 text-xs font-semibold transition cursor-pointer disabled:opacity-50 ${
                      isSelected
                        ? 'border-[#2D5A46] bg-[#2D5A46] text-white shadow-sm'
                        : 'border-[#DCE2DF] bg-[#FFFFFF] text-[#4A5550] hover:border-[#2D5A46] hover:text-[#181D1B]'
                    }`}
                  >
                    {isSelected && <CheckCircle2 className="h-3 w-3 text-[#BCE0CE]" />}
                    <span>
                      {opt.id === 'simplify'
                        ? 'Simpler'
                        : opt.id === 'maintain'
                        ? 'Standard'
                        : 'More Complex'}
                    </span>
                  </button>
                );
              })}
            </div>

            {strictMode ? (
              <div className="inline-flex items-center gap-1.5 text-xs font-medium text-[#7A3E33]">
                <EyeOff className="h-3.5 w-3.5 shrink-0 text-[#8C4A3E]" />
                <span>Strict Mode ON (Uninterrupted reading)</span>
              </div>
            ) : (
              <div className="flex flex-wrap items-center gap-3 text-[11px] text-[#5C6661]">
                <span>Tap any word for instant meaning &amp; audio</span>
                <span className="hidden sm:inline text-[#C5CECA]">•</span>
                <span className="inline-flex items-center gap-1 font-medium text-[#7C581E]">
                  <span className="inline-block h-2 w-2 rounded-full bg-[#C9963E]" />
                  Learning
                </span>
                <span className="inline-flex items-center gap-1 font-medium text-[#285943]">
                  <span className="inline-block h-2 w-2 rounded-full bg-[#3B7A57]" />
                  Acquired
                </span>
              </div>
            )}
          </div>
        )}
      </div>

      {/* Floating Zero-Latency Word Meaning & Pronunciation Box (Always visible in viewport without scrolling!) */}
      {!strictMode && selectedTokenInfo && (
        <div
          ref={popupCardRef}
          className="fixed bottom-4 left-1/2 z-50 w-[calc(100%-1.5rem)] max-w-lg -translate-x-1/2 rounded-2xl border-2 border-[#234E68]/35 bg-[#FFFFFF]/98 p-4 shadow-2xl backdrop-blur-md transition-all"
        >
          {/* Prominent, Always-Reachable Top-Right Close Button */}
          <button
            type="button"
            onClick={() => setSelectedTokenInfo(null)}
            aria-label="Close word definition popup"
            className="absolute right-3 top-3 inline-flex items-center gap-1 rounded-lg border border-[#DCE2DF] bg-[#F7F9F8] px-2.5 py-1.5 text-xs font-semibold text-[#181D1B] shadow-2xs transition hover:bg-[#E4EFF6] active:scale-95"
          >
            <X className="h-3.5 w-3.5" />
            <span>Close</span>
          </button>

          <div className="pr-20 space-y-1.5">
            <div className="flex flex-wrap items-baseline gap-2.5">
              <span className="font-serif text-2xl font-bold text-[#181D1B]">
                {selectedTokenInfo.token.surface}
              </span>
              {selectedTokenInfo.token.reading && (
                <span className="rounded border border-[#D5D9E8] bg-[#F2F3F8] px-2 py-0.5 text-xs font-semibold text-[#3E4563]">
                  {selectedTokenInfo.token.reading}
                </span>
              )}
              <span className="text-xs text-[#5C6661]">
                Base:{' '}
                <strong className="font-semibold text-[#181D1B]">
                  {selectedTokenInfo.token.baseForm}
                </strong>
              </span>
            </div>

            <p className="text-base font-semibold text-[#1E3F54]">
              “{selectedTokenInfo.token.contextualMeaning}”
            </p>

            <div className="flex flex-wrap items-center gap-2 pt-1">
              <button
                type="button"
                onClick={() =>
                  speakSingleWord(selectedTokenInfo.token.surface, profile.bcp47)
                }
                className="inline-flex items-center gap-1.5 rounded-lg border border-[#234E68] bg-[#234E68] px-3 py-1 text-xs font-semibold text-white shadow-2xs transition hover:bg-[#1B3E54] active:scale-95"
                title="Pronounce word again"
              >
                <Volume2 className="h-3.5 w-3.5" />
                <span>Listen ({profile.bcp47})</span>
              </button>

              {selectedVocabEntry && (
                <div
                  className={`flex items-center gap-1.5 rounded-lg border px-2.5 py-1 text-xs font-semibold ${
                    selectedVocabEntry.status === 'acquired'
                      ? 'border-[#C2DFD0] bg-[#EFF6F2] text-[#285943]'
                      : 'border-[#E8D7B4] bg-[#FDF8EE] text-[#7C581E]'
                  }`}
                >
                  {selectedVocabEntry.status === 'acquired' ? (
                    <>
                      <CheckCircle2 className="h-3.5 w-3.5 text-[#3B7A57]" />
                      <span>Acquired ({selectedVocabEntry.exposures}/5)</span>
                    </>
                  ) : (
                    <>
                      <BookMarked className="h-3.5 w-3.5 text-[#B88328]" />
                      <span>
                        Saved ({selectedVocabEntry.exposures}/
                        {ACQUISITION_EXPOSURE_THRESHOLD})
                      </span>
                    </>
                  )}
                </div>
              )}
            </div>
          </div>
        </div>
      )}

      {/* Main Pre-Tokenised Story Body */}
      <div className="space-y-5">
        {(chapter.sentences || []).map((sentence, sIdx) => {
          const isGrammarOpen = Boolean(openGrammarNotes[sIdx]);
          const sentenceKey = `${chapter.id}-${sIdx}`;
          const isThisSentenceActive = sentenceAudioState.sentenceKey === sentenceKey;
          const isThisSentencePlaying =
            isThisSentenceActive && sentenceAudioState.status === 'playing';
          const isThisSentencePaused =
            isThisSentenceActive && sentenceAudioState.status === 'paused';
          const isThisSentenceLoading =
            isThisSentenceActive && sentenceAudioState.status === 'loading';
          const isSentenceSpeaking =
            activeSpokenSentenceIdx === sIdx || isThisSentencePlaying || isThisSentencePaused;
          const englishLine =
            sentence.englishTranslation ||
            fetchedTranslations[sentenceKey] ||
            '';

          return (
            <div
              key={sIdx}
              className={`group relative rounded-xl border px-3.5 py-3 transition-colors ${
                isSentenceSpeaking
                  ? 'border-[#94B8CE] bg-[#EEF5F9] ring-1 ring-[#94B8CE]'
                  : 'border-[#E6ECE9] bg-[#FCFDFC] hover:border-[#C9D8D1] hover:bg-[#F8FAF9]'
              }`}
            >
              {/* Top-Right Sentence ElevenLabs Play/Pause + Restart Mini Controls */}
              <div className="float-right ml-3 mb-1 inline-flex items-center gap-1 rounded-lg border border-[#D5E1E8] bg-white/95 px-1.5 py-1 shadow-sm">
                <button
                  type="button"
                  onClick={() =>
                    controlSentenceAudio({
                      sentenceKey,
                      sentenceText: sentence.fullSentence,
                      bcp47: profile.bcp47,
                      forceRestart: false,
                      onStateChange: setSentenceAudioState,
                    })
                  }
                  title={
                    isThisSentencePlaying
                      ? `Pause sentence ${sIdx + 1} (ElevenLabs)`
                      : isThisSentencePaused
                      ? `Resume sentence ${sIdx + 1} (ElevenLabs)`
                      : `Play sentence ${sIdx + 1} (ElevenLabs)`
                  }
                  aria-label={
                    isThisSentencePlaying
                      ? `Pause sentence ${sIdx + 1}`
                      : `Play sentence ${sIdx + 1}`
                  }
                  className={`inline-flex h-6 w-6 items-center justify-center rounded-md transition cursor-pointer ${
                    isThisSentencePlaying
                      ? 'bg-[#EA580C] text-white shadow-sm'
                      : isThisSentencePaused
                      ? 'bg-[#234E68] text-white'
                      : 'text-[#234E68] hover:bg-[#E4EFF6]'
                  }`}
                >
                  {isThisSentenceLoading ? (
                    <Loader2 className="h-3.5 w-3.5 animate-spin text-[#EA580C]" />
                  ) : isThisSentencePlaying ? (
                    <Pause className="h-3.5 w-3.5" />
                  ) : (
                    <Play className="h-3.5 w-3.5 translate-x-[0.5px]" />
                  )}
                </button>

                <button
                  type="button"
                  onClick={() =>
                    controlSentenceAudio({
                      sentenceKey,
                      sentenceText: sentence.fullSentence,
                      bcp47: profile.bcp47,
                      forceRestart: true,
                      onStateChange: setSentenceAudioState,
                    })
                  }
                  title={`Restart sentence ${sIdx + 1} from beginning (ElevenLabs)`}
                  aria-label={`Restart sentence ${sIdx + 1}`}
                  className="inline-flex h-6 w-6 items-center justify-center rounded-md text-[#5C6661] transition hover:bg-[#E4EFF6] hover:text-[#181D1B] cursor-pointer"
                >
                  <RotateCcw className="h-3.5 w-3.5" />
                </button>
              </div>

              {/* Sentence Tokens Flow */}
              <div className="font-serif text-xl leading-[2.25] tracking-normal text-[#181D1B] sm:text-[23px] sm:leading-[2.35]">
                {(sentence.tokens || []).map((token, tIdx) => {
                  const vocabEntry = !strictMode ? getTokenVocabStatus(token) : null;
                  const isSelected =
                    !strictMode &&
                    selectedTokenInfo?.sentenceIndex === sIdx &&
                    selectedTokenInfo?.tokenIndex === tIdx;

                  const shouldRenderRuby =
                    isJapanese && showPhonetics && Boolean(token.reading);

                  let statusClasses = '';
                  if (!strictMode) {
                    if (isSelected) {
                      statusClasses =
                        'bg-[#DCEBF4] text-[#181D1B] rounded px-1 ring-1 ring-[#234E68]';
                    } else if (vocabEntry?.status === 'learning') {
                      statusClasses =
                        'decoration-[#C9963E] decoration-dotted underline decoration-2 underline-offset-4 bg-[#FDF8EE] rounded px-0.5 hover:bg-[#F9EED8]';
                    } else if (vocabEntry?.status === 'acquired') {
                      statusClasses =
                        'decoration-[#52826A] decoration-solid underline decoration-1 underline-offset-4 hover:bg-[#EFF6F2] rounded px-0.5';
                    } else {
                      statusClasses =
                        'hover:bg-[#EEF2F0] rounded px-0.5 transition-colors';
                    }
                  }

                  return (
                    <React.Fragment key={tIdx}>
                      <span
                        data-word-token="true"
                        role={strictMode ? undefined : 'button'}
                        tabIndex={strictMode ? -1 : 0}
                        onClick={() => handleTokenClick(sIdx, tIdx, token)}
                        onKeyDown={(e) => {
                          if (!strictMode && (e.key === 'Enter' || e.key === ' ')) {
                            e.preventDefault();
                            handleTokenClick(sIdx, tIdx, token);
                          }
                        }}
                        className={`inline-block select-text ${
                          strictMode ? 'cursor-default' : 'cursor-pointer'
                        } ${statusClasses}`}
                      >
                        {shouldRenderRuby ? (
                          <ruby>
                            {token.surface}
                            <rt>{token.reading}</rt>
                          </ruby>
                        ) : (
                          token.surface
                        )}
                      </span>
                      {!profile.noWordSpaces && tIdx < sentence.tokens.length - 1 ? ' ' : ''}
                    </React.Fragment>
                  );
                })}

                {/* End-of-Sentence Subtle Grammar Pattern Icon & Translate Icon (Hidden in Reader View) */}
                {!readerOnlyMode && (
                  <span className="ml-2 inline-flex items-center gap-1 align-middle font-sans">
                    <button
                      type="button"
                      onClick={() => toggleGrammarNote(sIdx)}
                      title="Pattern Recognition Note: Click for a plain-English explanation of this sentence's grammar pattern"
                      className={`inline-flex items-center gap-1 rounded-full border px-2 py-0.5 text-[11px] font-medium transition ${
                        isGrammarOpen
                          ? 'border-[#464E70] bg-[#464E70] text-white'
                          : 'border-[#D6D9E8] bg-[#F5F6FA] text-[#464E70] opacity-85 hover:bg-[#E8EAF4] group-hover:opacity-100'
                      }`}
                    >
                      <Sparkles className="h-3 w-3" />
                      <span className="hidden sm:inline">Pattern</span>
                    </button>

                    <button
                      type="button"
                      onClick={() => onTranslateSentence(sentence.fullSentence)}
                      title="Open this sentence in the top Translator panel"
                      className="inline-flex items-center gap-1 rounded-full border border-[#C9DCE8] bg-[#F2F7FA] px-2 py-0.5 text-[11px] font-medium text-[#234E68] opacity-80 transition hover:bg-[#E4EFF6] group-hover:opacity-100"
                    >
                      <Globe className="h-3 w-3" />
                      <span className="hidden md:inline">Translate</span>
                    </button>
                  </span>
                )}
              </div>

              {/* Subtle Romanisation Line (Heather-Slate) */}
              {showPhonetics && sentence.romanisation && (
                <p className="mt-1 font-sans text-xs italic tracking-wide text-[#525A78]">
                  {sentence.romanisation}
                </p>
              )}

              {/* Optional English Translation Line (Quiet Nordic Sage-Mist) */}
              {showEnglishUnderSentence && (
                <p className="mt-1.5 rounded-lg border-l-2 border-[#4C7C64] bg-[#F2F7F4] px-3 py-1 font-sans text-sm font-medium text-[#244233]">
                  {englishLine || 'Translating sentence to English...'}
                </p>
              )}

              {/* Plain-English 1-Sentence Grammar Pattern Callout (Quiet Nordic Heather-Indigo) */}
              {!readerOnlyMode && isGrammarOpen && sentence.grammarNote && (
                <div className="mt-2.5 flex items-start gap-2 rounded-lg border border-[#D6D9E8] bg-[#F5F6FA] px-3.5 py-2 font-sans text-xs leading-relaxed text-[#333954]">
                  <Sparkles className="mt-0.5 h-3.5 w-3.5 shrink-0 text-[#464E70]" />
                  <div>
                    <span className="font-semibold">Sentence Pattern: </span>
                    <span>{sentence.grammarNote}</span>
                  </div>
                </div>
              )}
            </div>
          );
        })}
      </div>

      {/* Recycled Target Vocabulary Pill Summary (Hidden in Reader View) */}
      {!readerOnlyMode &&
        Array.isArray(chapter.recycledWordsUsed) &&
        chapter.recycledWordsUsed.length > 0 && (
          <div className="mt-8 border-t border-[#E8ECEA] pt-4">
            <div className="flex flex-wrap items-center gap-2 text-xs text-[#5C6661]">
              <span className="font-semibold text-[#181D1B]">
                Target Words Woven Into This Chapter:
              </span>
              {chapter.recycledWordsUsed.map((word, idx) => (
                <span
                  key={idx}
                  className="rounded-md border border-[#E8D7B4] bg-[#FDF8EE] px-2 py-0.5 font-medium text-[#7C581E]"
                >
                  {word}
                </span>
              ))}
            </div>
          </div>
        )}

      {/* Compact Story Adaptation Bar right below the story text (Hidden in Reader View) */}
      {!readerOnlyMode && (
        <div className="mt-6 flex flex-wrap items-center justify-between gap-3 rounded-xl border border-[#E2E7E4] bg-[#F8FAF9] px-4 py-3">
          <div className="flex flex-wrap items-center gap-2">
            <span className="text-xs font-semibold text-[#4A5550]">
              Story Level:
            </span>
            {difficultyOptions.map((opt) => {
              const isSelected = activeDifficulty === opt.id;
              return (
                <button
                  key={opt.id}
                  type="button"
                  disabled={isGeneratingChapter}
                  onClick={() => onSelectDifficultyLevel?.(opt.id)}
                  className={`inline-flex items-center gap-1.5 rounded-lg border px-2.5 py-1 text-xs font-semibold transition cursor-pointer disabled:opacity-50 ${
                    isSelected
                      ? 'border-[#2D5A46] bg-[#2D5A46] text-white shadow-sm'
                      : 'border-[#DCE2DF] bg-[#FFFFFF] text-[#4A5550] hover:border-[#2D5A46] hover:text-[#181D1B]'
                  }`}
                >
                  {isSelected && <CheckCircle2 className="h-3 w-3 text-[#BCE0CE]" />}
                  <span>{opt.shortLabel}</span>
                </button>
              );
            })}
          </div>

          <button
            type="button"
            disabled={isGeneratingChapter}
            onClick={onRegenerateCurrentChapter}
            className="inline-flex items-center gap-1.5 rounded-lg border border-[#94B8CE] bg-[#F1F6FA] px-3 py-1.5 text-xs font-semibold text-[#1E3F54] transition hover:bg-[#E3EEF5] cursor-pointer disabled:opacity-50"
            title="Generate a fresh story with new vocabulary for this chapter"
          >
            {isGeneratingChapter ? (
              <Loader2 className="h-3.5 w-3.5 animate-spin text-[#234E68]" />
            ) : (
              <RefreshCw className="h-3.5 w-3.5 text-[#234E68]" />
            )}
            <span>New Story Variant</span>
          </button>

          {generationError && (
            <div className="w-full rounded-lg border border-red-300 bg-red-50 px-3 py-2 text-xs text-red-900">
              {generationError}
            </div>
          )}
        </div>
      )}

      {/* End-of-Chapter Learning Consolidation & Active-Recall Recap (Hidden in Reader View) */}
      {!readerOnlyMode && (
        <ChapterRecapSection
          profile={profile}
          chapter={chapter}
          chapterIndex={chapterIndex}
          totalChapters={totalChapters}
          onSelectChapterIndex={onSelectChapterIndex}
          onGenerateNextChapter={onGenerateNextChapter}
          isGeneratingChapter={isGeneratingChapter}
        />
      )}
    </article>
  );
}


// ==================== src/components/VocabSidebar.jsx ====================







function VocabSidebar({
  profile,
  chapter,
  onToggleWordStatus,
  onRemoveWord,
  onAddCustomVocabWord,
}) {
  const [activeTab, setActiveTab] = useState('learning');

  const [dictQuery, setDictQuery] = useState('');
  const [dictDirection, setDictDirection] = useState('to_en');
  const [dictResult, setDictResult] = useState(null);
  const [isLookingUp, setIsLookingUp] = useState(false);
  const [dictError, setDictError] = useState(null);
  const [justAddedToBank, setJustAddedToBank] = useState(false);

  const vocabBank = (profile?.vocabBank || []).filter(
    (w) => !isProperNounOrNonLexicalToken(w)
  );
  const learningWords = vocabBank.filter((w) => w.status === 'learning');
  const acquiredWords = vocabBank.filter((w) => w.status === 'acquired');
  const priorityNextFive = getPriorityLearningWords(vocabBank, 5);
  const priorityBaseForms = new Set(priorityNextFive.map((w) => w.baseForm));

  const displayedWords = activeTab === 'learning' ? learningWords : acquiredWords;

  const uniqueChapterWords = useMemo(() => {
    const seen = new Set();
    const list = [];

    (chapter?.sentences || []).forEach((sentence) => {
      (sentence.tokens || []).forEach((token) => {
        if (isProperNounOrNonLexicalToken(token)) return;

        const cleanSurface = (token.surface || '')
          .replace(/[.,!?;:«»"“”'’()[\]{}،、。！？「」『』・]/g, '')
          .trim();
        const cleanBase = (token.baseForm || cleanSurface)
          .replace(/[.,!?;:«»"“”'’()[\]{}،、。！？「」『』・]/g, '')
          .trim();

        if (!cleanSurface && !cleanBase) return;

        const dedupeKey = normalizeLexeme(cleanBase || cleanSurface);
        if (!dedupeKey || seen.has(dedupeKey)) return;

        seen.add(dedupeKey);
        list.push({
          surface: cleanSurface || token.surface,
          baseForm: cleanBase || cleanSurface,
          reading: token.reading || null,
          contextualMeaning: token.contextualMeaning || '',
        });
      });
    });

    return list;
  }, [chapter]);

  const handleDictionaryLookup = async (e) => {
    e?.preventDefault();
    const trimmed = dictQuery.trim();
    if (!trimmed) return;

    setIsLookingUp(true);
    setDictError(null);
    setJustAddedToBank(false);

    const sl = dictDirection === 'to_en' ? profile.translateCode : 'en';
    const tl = dictDirection === 'to_en' ? 'en' : profile.translateCode;

    try {
      const res = await lookupDictionaryWordOrPhrase({
        query: trimmed,
        sourceLang: sl,
        targetLang: tl,
      });
      setDictResult(res);
    } catch (err) {
      setDictError(err.message || 'Lookup failed. Check your connection.');
    } finally {
      setIsLookingUp(false);
    }
  };

  const handleSaveLookupToBank = () => {
    if (!dictResult) return;
    const targetWord =
      dictDirection === 'to_en' ? dictResult.query : dictResult.primaryTranslation;
    const englishMeaning =
      dictDirection === 'to_en' ? dictResult.primaryTranslation : dictResult.query;

    onAddCustomVocabWord({
      surface: targetWord,
      reading: dictResult.phonetic || null,
      baseForm: targetWord,
      contextualMeaning: englishMeaning,
    });
    setJustAddedToBank(true);
  };

  return (
    <aside className="space-y-4">
      {/* 1. Interactive Dictionary & Phrase Lookup Box (Quiet Fjord Blue Zone) */}
      <div className="rounded-2xl border border-[#C9DCE8] bg-[#FFFFFF] p-4 shadow-2xs">
        <div className="flex items-center justify-between gap-2">
          <div className="flex items-center gap-2 text-xs font-bold uppercase tracking-wider text-[#234E68]">
            <BookOpen className="h-4 w-4" />
            <span>Dictionary &amp; Phrase Lookup</span>
          </div>

          <button
            type="button"
            onClick={() => {
              setDictDirection((prev) => (prev === 'to_en' ? 'from_en' : 'to_en'));
              setDictResult(null);
            }}
            className="inline-flex items-center gap-1 rounded-lg border border-[#C9DCE8] bg-[#F1F6FA] px-2 py-0.5 text-[11px] font-semibold text-[#1E3F54] hover:bg-[#E4EFF6]"
            title="Switch lookup direction"
          >
            <span>
              {dictDirection === 'to_en'
                ? `${profile.name} → English`
                : `English → ${profile.name}`}
            </span>
            <ArrowLeftRight className="h-3 w-3 text-[#234E68]" />
          </button>
        </div>

        <p className="mt-1 text-[11px] text-[#5C6661]">
          Consult any word or sentence (even outside the story) and save it to your Vocab Bank.
        </p>

        <form onSubmit={handleDictionaryLookup} className="mt-2.5 flex gap-1.5">
          <input
            type="text"
            value={dictQuery}
            onChange={(e) => setDictQuery(e.target.value)}
            placeholder={
              dictDirection === 'to_en'
                ? `Type any ${profile.name} word or sentence...`
                : `Type an English word or phrase...`
            }
            className="flex-1 rounded-xl border border-[#C9DCE8] bg-[#F4F8FA] px-3 py-1.5 text-xs text-[#181D1B] placeholder:text-[#7B8E99] focus:border-[#234E68] focus:bg-white focus:outline-none"
          />
          <button
            type="submit"
            disabled={isLookingUp || !dictQuery.trim()}
            className="inline-flex items-center gap-1 rounded-xl bg-[#234E68] px-3 py-1.5 text-xs font-semibold text-white transition hover:bg-[#1B3E54] disabled:opacity-50"
          >
            {isLookingUp ? (
              <Loader2 className="h-3.5 w-3.5 animate-spin" />
            ) : (
              <Search className="h-3.5 w-3.5" />
            )}
            <span>Consult</span>
          </button>
        </form>

        {dictError && (
          <p className="mt-2 text-xs text-[#8C4A3E]">{dictError}</p>
        )}

        {dictResult && (
          <div className="mt-3 rounded-xl border border-[#C9DCE8] bg-[#F3F8FB] p-3">
            <div className="flex items-start justify-between gap-2">
              <div>
                <div className="flex flex-wrap items-baseline gap-2">
                  <span className="font-serif text-base font-bold text-[#181D1B]">
                    {dictResult.primaryTranslation}
                  </span>
                  {dictResult.phonetic && (
                    <span className="rounded border border-[#D5D9E8] bg-[#FFFFFF] px-1.5 py-0.5 text-[10px] font-medium text-[#3E4563]">
                      {dictResult.phonetic}
                    </span>
                  )}
                </div>
                <p className="text-[11px] text-[#5C6661]">
                  Query: &ldquo;{dictResult.query}&rdquo;
                </p>
              </div>

              <div className="flex items-center gap-1">
                <button
                  type="button"
                  onClick={() => {
                    const textToSpeak =
                      dictDirection === 'to_en'
                        ? dictResult.query
                        : dictResult.primaryTranslation;
                    speakSingleWord(textToSpeak, profile.bcp47);
                  }}
                  className="rounded-lg border border-[#C9DCE8] bg-[#FFFFFF] p-1.5 text-[#234E68] hover:bg-[#E4EFF6]"
                  title={`Pronounce in ${profile.name} (${profile.bcp47})`}
                >
                  <Volume2 className="h-3.5 w-3.5" />
                </button>

                <button
                  type="button"
                  onClick={handleSaveLookupToBank}
                  disabled={justAddedToBank}
                  className={`inline-flex items-center gap-1 rounded-lg px-2 py-1 text-[11px] font-semibold transition ${
                    justAddedToBank
                      ? 'bg-[#2D5A46] text-white'
                      : 'bg-[#234E68] text-white hover:bg-[#1B3E54]'
                  }`}
                  title="Add this word to your Vocab Bank for story recycling"
                >
                  {justAddedToBank ? (
                    <>
                      <CheckCircle2 className="h-3 w-3" />
                      <span>Saved</span>
                    </>
                  ) : (
                    <>
                      <Plus className="h-3 w-3" />
                      <span>Save</span>
                    </>
                  )}
                </button>
              </div>
            </div>

            {Array.isArray(dictResult.dictionaryEntries) &&
              dictResult.dictionaryEntries.length > 0 && (
                <div className="mt-2.5 space-y-1.5 border-t border-[#D5E4EE] pt-2">
                  {dictResult.dictionaryEntries.map((entry, idx) => (
                    <div key={idx} className="text-[11px]">
                      <span className="font-semibold italic text-[#234E68]">
                        {entry.partOfSpeech}:{' '}
                      </span>
                      <span className="text-[#181D1B]">
                        {entry.terms.join(', ')}
                      </span>
                    </div>
                  ))}
                </div>
              )}
          </div>
        )}
      </div>

      {/* 2. Independent Vocabulary Bank Card (Warm Ochre Learning + Pine-Sage Acquired) */}
      <div className="rounded-2xl border border-[#E2E7E4] bg-[#FFFFFF] p-4 shadow-2xs">
        <div className="flex items-center justify-between">
          <div className="flex items-center gap-2 text-xs font-bold uppercase tracking-wider text-[#785420]">
            <BookMarked className="h-4 w-4 text-[#B88328]" />
            <span>{profile.name} Vocab Bank</span>
          </div>
          <span className="rounded-full border border-[#E8D7B4] bg-[#FDF8EE] px-2 py-0.5 text-[11px] font-semibold text-[#785420]">
            {vocabBank.length} Total
          </span>
        </div>

        {/* Next Chapter Priority Queue Banner with X remove buttons */}
        {priorityNextFive.length > 0 && (
          <div className="mt-3 rounded-xl border border-[#E6D6B8] bg-[#FBF7F0] p-2.5">
            <div className="flex items-center gap-1.5 text-[11px] font-semibold text-[#785420]">
              <Sparkles className="h-3.5 w-3.5 text-[#B88328]" />
              <span>Queued for Next Chapter (Top {priorityNextFive.length}):</span>
            </div>
            <div className="mt-1.5 flex flex-wrap gap-1.5">
              {priorityNextFive.map((item, idx) => (
                <span
                  key={`${item.baseForm}-${idx}`}
                  className="inline-flex items-center gap-1 rounded-md border border-[#E6D6B8] bg-[#FFFFFF] pl-2 pr-1 py-0.5 text-[11px] font-medium text-[#181D1B] shadow-2xs"
                >
                  <span>{item.baseForm}</span>
                  <span className="text-[10px] font-semibold text-[#9C6F23]">
                    ({item.exposures}/5)
                  </span>
                  <button
                    type="button"
                    onClick={() => onRemoveWord(item.baseForm)}
                    className="ml-0.5 rounded p-0.5 text-[#87928D] transition hover:bg-red-100 hover:text-red-800"
                    title={`Remove "${item.baseForm}" from queue and Vocab Bank`}
                  >
                    <X className="h-3 w-3" />
                  </button>
                </span>
              ))}
            </div>
          </div>
        )}

        {/* Tabs: Learning (Warm Ochre) vs Acquired (Pine-Sage) */}
        <div className="mt-3 grid grid-cols-2 gap-1 rounded-xl bg-[#F3F6F4] p-1">
          <button
            type="button"
            onClick={() => setActiveTab('learning')}
            className={`rounded-lg py-1.5 text-xs font-semibold transition ${
              activeTab === 'learning'
                ? 'bg-[#8F6523] text-white shadow-2xs'
                : 'text-[#5C6661] hover:text-[#181D1B]'
            }`}
          >
            Learning ({learningWords.length})
          </button>
          <button
            type="button"
            onClick={() => setActiveTab('acquired')}
            className={`rounded-lg py-1.5 text-xs font-semibold transition ${
              activeTab === 'acquired'
                ? 'bg-[#2D5A46] text-white shadow-2xs'
                : 'text-[#5C6661] hover:text-[#181D1B]'
            }`}
          >
            Acquired ({acquiredWords.length})
          </button>
        </div>

        {/* Independent Scrollable Word List */}
        <div className="mt-3 max-h-[260px] space-y-2 overflow-y-auto pr-1">
          {displayedWords.length === 0 ? (
            <div className="rounded-xl border border-dashed border-[#D5DDD9] p-5 text-center text-xs text-[#737F79]">
              {activeTab === 'learning'
                ? 'Click any word in the story or use the Dictionary box above to save words to your Learning bank.'
                : 'Words automatically graduate to Acquired once they reach 5 contextual exposures across chapters.'}
            </div>
          ) : (
            displayedWords.map((entry, idx) => {
              const isQueued =
                entry.status === 'learning' && priorityBaseForms.has(entry.baseForm);
              const progressPct = Math.min(
                100,
                Math.round(((entry.exposures || 0) / ACQUISITION_EXPOSURE_THRESHOLD) * 100)
              );

              return (
                <div
                  key={`${entry.baseForm}-${idx}`}
                  className="rounded-xl border border-[#E6ECE9] bg-[#F9FBF9] p-2.5 transition hover:border-[#C9D6D0]"
                >
                  <div className="flex items-start justify-between gap-2">
                    <div>
                      <div className="flex flex-wrap items-baseline gap-1.5">
                        <span className="font-serif text-base font-bold text-[#181D1B]">
                          {entry.word}
                        </span>
                        {entry.reading && (
                          <span className="text-[11px] font-medium text-[#464E70]">
                            [{entry.reading}]
                          </span>
                        )}
                        {entry.baseForm && entry.baseForm !== entry.word && (
                          <span className="text-[11px] text-[#737F79]">
                            ({entry.baseForm})
                          </span>
                        )}
                      </div>
                      <p className="mt-0.5 text-xs font-medium text-[#2C3531]">
                        {entry.contextualMeaning}
                      </p>
                    </div>

                    <div className="flex items-center gap-0.5">
                      <button
                        type="button"
                        onClick={() => speakSingleWord(entry.word, profile.bcp47)}
                        className="rounded-md p-1.5 text-[#5C6661] hover:bg-[#E4EFF6] hover:text-[#234E68]"
                        title={`Pronounce (${profile.bcp47})`}
                      >
                        <Volume2 className="h-3.5 w-3.5" />
                      </button>
                      <button
                        type="button"
                        onClick={() => onToggleWordStatus(entry.baseForm)}
                        className="rounded-md p-1.5 text-[#5C6661] hover:bg-[#E5F0EA] hover:text-[#2D5A46]"
                        title={
                          entry.status === 'learning'
                            ? 'Mark as Acquired now'
                            : 'Move back to Learning'
                        }
                      >
                        {entry.status === 'learning' ? (
                          <CheckCircle2 className="h-3.5 w-3.5" />
                        ) : (
                          <RefreshCw className="h-3.5 w-3.5" />
                        )}
                      </button>
                      <button
                        type="button"

function TranslatorPanel({
  activeProfile,
  initialText,
  onClose,
}) {
  const [sourceLang, setSourceLang] = useState(activeProfile?.translateCode || 'fr');
  const [inputText, setInputText] = useState(initialText || '');
  const [translatedText, setTranslatedText] = useState('');
  const [isTranslating, setIsTranslating] = useState(false);
  const [error, setError] = useState(null);
  const [copied, setCopied] = useState(false);

  // Sync language when active profile switches
  useEffect(() => {
    if (activeProfile?.translateCode) {
      setSourceLang(activeProfile.translateCode);
    }
  }, [activeProfile?.translateCode]);

  // Automatically translate when a sentence is sent from the reader
  useEffect(() => {
    if (initialText && initialText.trim()) {
      setInputText(initialText);
      runTranslation(initialText, activeProfile?.translateCode || sourceLang);
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [initialText]);

  const runTranslation = async (textToTranslate = inputText, lang = sourceLang) => {
    const trimmed = (textToTranslate || '').trim();
    if (!trimmed) {
      setTranslatedText('');
      return;
    }

    setIsTranslating(true);
    setError(null);
    try {
      const result = await translateToEnglish(trimmed, lang);
      setTranslatedText(result.translatedText);
    } catch (err) {
      setError(
        `${err.message}. You can also open the phrase directly in Google Translate below.`
      );
    } finally {
      setIsTranslating(false);
    }
  };

  const handleCopy = () => {
    if (!translatedText) return;
    navigator.clipboard?.writeText(translatedText);
    setCopied(true);
    setTimeout(() => setCopied(false), 1800);
  };

  const currentLangMeta =
    LANGUAGE_METADATA.find((l) => l.translateCode === sourceLang) || activeProfile;

  return (
    <div className="mb-6 rounded-2xl border border-stone-900/30 bg-[#FFFFFF] p-5 shadow-sm">
      <div className="flex flex-wrap items-center justify-between gap-2 border-b border-[#EEF2F0] pb-3">
        <div className="flex items-center gap-2">
          <div className="flex h-7 w-7 items-center justify-center rounded-lg bg-stone-900 text-stone-100">
            <Globe className="h-4 w-4" />
          </div>
          <div>
            <h3 className="text-sm font-semibold text-[#181D1B]">
              Built-in Google Translate to English
            </h3>
            <p className="text-[11px] text-[#5C6661]">
              Instant translation from French, Italian, Korean, Japanese &amp; Spanish to English
            </p>
          </div>
        </div>

        <div className="flex items-center gap-2">
          {/* Source Language Selector */}
          <select
            value={sourceLang}
            onChange={(e) => {
              const nextLang = e.target.value;
              setSourceLang(nextLang);
              if (inputText.trim()) {
                runTranslation(inputText, nextLang);
              }
            }}
            className="rounded-lg border border-[#D5DDD9] bg-[#F7F9F8] px-2.5 py-1 text-xs font-semibold text-[#181D1B] focus:border-stone-900 focus:outline-none"
          >
            {LANGUAGE_METADATA.map((lang) => (
              <option key={lang.id} value={lang.translateCode}>
                {lang.flag} {lang.name} ({lang.nativeName}) → English
              </option>
            ))}
            <option value="auto">🌐 Auto-Detect → English</option>
          </select>

          <button
            type="button"
            onClick={onClose}
            className="rounded-lg p-1 text-[#5C6661] hover:bg-[#EEF2F0] hover:text-[#181D1B]"
            title="Close Translator"
          >
            <X className="h-4 w-4" />
          </button>
        </div>
      </div>

      <div className="mt-4 grid grid-cols-1 gap-4 md:grid-cols-2">
        {/* Source Language Input Box */}
        <div className="flex flex-col">
          <div className="mb-1.5 flex items-center justify-between text-xs font-medium text-[#5C6661]">
            <span>Source Text ({currentLangMeta?.name || 'Source'})</span>
            <div className="flex items-center gap-2">
              {inputText.trim() && (
                <button
                  type="button"
                  onClick={() =>
                    speakSingleWord(inputText, currentLangMeta?.bcp47 || 'fr-FR', 0.95)
                  }
                  className="inline-flex items-center gap-1 text-[11px] font-medium text-stone-900 hover:underline"
                >
                  <Volume2 className="h-3 w-3" />
                  Listen
                </button>
              )}
              {inputText && (
                <button
                  type="button"
                  onClick={() => {
                    setInputText('');
                    setTranslatedText('');
                  }}
                  className="text-[11px] text-[#87928D] hover:text-[#181D1B]"
                >
                  Clear
                </button>
              )}
            </div>
          </div>

          <textarea
            rows={3}
            value={inputText}
            onChange={(e) => setInputText(e.target.value)}
            placeholder={`Paste or click "Translate" on any ${
              currentLangMeta?.name || ''
            } sentence in the story...`}
            className="w-full rounded-xl border border-[#D5DDD9] bg-[#F7F9F8] p-3 font-serif text-base text-[#181D1B] placeholder:font-sans placeholder:text-xs placeholder:text-[#87928D] focus:border-stone-900 focus:outline-none"
          />

          <div className="mt-2 flex items-center justify-between">
            <a
              href={buildGoogleTranslateWebUrl(inputText, sourceLang)}
              target="_blank"
              rel="noreferrer"
              className="inline-flex items-center gap-1 text-[11px] font-medium text-[#5C6661] hover:text-stone-900 hover:underline"
            >
              <span>Open in Google Translate Web</span>
              <ExternalLink className="h-3 w-3" />
            </a>

            <button
              type="button"
              onClick={() => runTranslation(inputText, sourceLang)}
              disabled={isTranslating || !inputText.trim()}
              className="inline-flex items-center gap-1.5 rounded-lg bg-stone-900 px-3.5 py-1.5 text-xs font-semibold text-stone-100 transition hover:bg-stone-700 disabled:opacity-50"
            >
              {isTranslating ? (
                <>
                  <Loader2 className="h-3.5 w-3.5 animate-spin" />
                  <span>Translating...</span>
                </>
              ) : (
                <>
                  <span>Translate to English</span>
                  <ArrowRight className="h-3.5 w-3.5" />
                </>
              )}
            </button>
          </div>
        </div>

        {/* English Output Box */}
        <div className="flex flex-col">
          <div className="mb-1.5 flex items-center justify-between text-xs font-medium text-[#5C6661]">
            <span>English Translation (Google Translate)</span>
            {translatedText && (
              <button
                type="button"
                onClick={handleCopy}
                className="inline-flex items-center gap-1 text-[11px] font-medium text-stone-900 hover:underline"
              >
                {copied ? (
                  <>
                    <Check className="h-3 w-3 text-emerald-700" />
                    <span className="text-emerald-800">Copied</span>
                  </>
                ) : (
                  <>
                    <Copy className="h-3 w-3" />
                    <span>Copy</span>
                  </>
                )}
              </button>
            )}
          </div>

          <div className="flex min-h-[96px] flex-1 items-center rounded-xl border border-[#EEF2F0] bg-[#F7F9F8]/60 p-3.5 text-sm leading-relaxed text-[#181D1B]">
            {isTranslating ? (
              <span className="flex items-center gap-2 text-xs text-[#737F79]">
                <Loader2 className="h-4 w-4 animate-spin text-stone-700" />
                Fetching English translation from Google Translate...
              </span>
            ) : error ? (
              <span className="text-xs text-red-800">{error}</span>
            ) : translatedText ? (
              <p className="font-sans text-base font-medium text-[#181D1B]">
                {translatedText}
              </p>
            ) : (
              <span className="text-xs text-[#87928D]">
                Click the &ldquo;Translate&rdquo; icon at the end of any sentence or type above to
                translate into English.
              </span>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

    error: null,
  });

    setTestState({ loading: true, success: null, error: null });
    try {
      const sampleBlobUrl = await testElevenLabsConnection({
        elevenLabsApiKey,
        voiceId: elevenLabsVoiceId,
      });
      try {
        const audio = new Audio(sampleBlobUrl);
        audio.onended = () => URL.revokeObjectURL(sampleBlobUrl);
